<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股看盤系統</title>
<style>
:root{
  --fs:1.3;
  --bg:#0f1218; --panel:#171b23; --panel2:#1d222c; --line:#2a303c; --text:#d7dce5; --mute:#8a93a3;
  --up:#ef4444; --dn:#22c55e; --accent:#f5b942; --blue:#4f9cf9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:calc(14px*var(--fs));line-height:1.6;font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:calc(16px*var(--fs));margin:0;color:var(--accent);white-space:nowrap}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mute);padding:6px 14px;cursor:pointer;font:inherit;border-radius:6px}
nav button.on{background:var(--panel2);color:var(--text)}
.fsbar{display:flex;gap:4px;margin-left:auto}
.fsbar button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer;font:inherit;font-weight:700}
.fsbar button:hover{border-color:var(--accent)}
.meta{margin-left:12px;color:var(--mute);font-size:calc(12px*var(--fs))}
.tab{display:none;height:calc(100vh - 49px*var(--fs))}
.tab.on{display:block}
.up{color:var(--up)} .dn{color:var(--dn)} .mute{color:var(--mute)}
.pill{display:inline-block;padding:0 8px;border-radius:10px;font-size:calc(12px*var(--fs));line-height:20px;white-space:nowrap}
.pill.disposal{background:#5b1d1d;color:#ff8a8a}
.pill.disposalNext{background:#5b3a1d;color:#ffb36b}
.pill.notice{background:#4a4420;color:#f2da6b}
.pill.normal{background:#1f2a21;color:#7ccf95}

/* 看盤 */
#view{display:grid;grid-template-columns:calc(260px*var(--fs)) minmax(0,1fr) calc(320px*var(--fs));height:100%}
#list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
#list .tools{position:sticky;top:0;background:var(--panel);padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px;z-index:2}
#list input,#list select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;min-width:0}
#list input{flex:1}
.row{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:7px 10px;border-bottom:1px solid #20252f;cursor:pointer}
.row:hover{background:var(--panel2)}
.row.sel{background:#232a38;box-shadow:inset 3px 0 var(--accent)}
.row .nm{font-weight:600}
.row .cd{color:var(--mute);font-size:calc(12px*var(--fs));margin-left:6px;font-weight:400}
.row .px{text-align:right;font-variant-numeric:tabular-nums}
.row .sub{font-size:calc(12px*var(--fs));color:var(--mute)}
.grp{padding:6px 10px;font-size:calc(12px*var(--fs));color:var(--mute);background:#12161d;border-bottom:1px solid #20252f}

#center{display:flex;flex-direction:column;min-width:0;height:100%}
#bar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
#bar .title{font-size:calc(16px*var(--fs));font-weight:700;margin-right:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);padding:4px 10px;cursor:pointer;font:inherit;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--panel2);color:var(--text)}
.ma-chip{cursor:pointer;user-select:none;padding:2px 8px;border-radius:10px;border:1px solid var(--line);font-size:calc(12px*var(--fs))}
.ma-chip.off{opacity:.35}
#legend{flex:0 0 auto;padding:4px 12px;line-height:1.6;font-size:calc(12.5px*var(--fs));font-variant-numeric:tabular-nums;border-bottom:1px solid #20252f;min-height:28px;overflow:hidden}
#legend b{margin-right:2px}
#charts{flex:1;min-height:0;display:flex;flex-direction:column}
#c-main{flex:1 1 60%;min-height:0}
#c-ind{flex:0 0 28%;min-height:90px;border-top:1px solid var(--line)}
#ind-label{position:absolute;left:8px;top:4px;font-size:calc(12px*var(--fs));color:var(--mute);z-index:3;pointer-events:none}
.cwrap{position:relative}

#info{border-left:1px solid var(--line);overflow:auto;background:var(--panel);padding:12px}
#info h2{margin:0 0 4px;font-size:calc(18px*var(--fs))}
#info h3{margin:16px 0 6px;font-size:calc(13px*var(--fs));color:var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:calc(13px*var(--fs))}
.kv div:nth-child(odd){color:var(--mute);white-space:nowrap}
.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
#info ul{margin:0;padding-left:18px;font-size:calc(13px*var(--fs))}
#info li{margin:3px 0}
.perf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.perf div{background:var(--panel2);border-radius:6px;padding:5px 2px;font-size:calc(12px*var(--fs))}
.perf b{display:block;font-size:calc(14px*var(--fs));font-variant-numeric:tabular-nums}

/* 摘要 */
.page{overflow:auto;padding:16px;height:100%}
.wrap{max-width:1180px;margin:0 auto}
.headline{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;font-size:calc(15px*var(--fs));margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .k{color:var(--mute);font-size:calc(12px*var(--fs))}
.card .v{font-size:calc(18px*var(--fs));font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.card .d{font-size:calc(12.5px*var(--fs));color:var(--mute)}
.card h4{margin:0 0 4px;font-size:calc(14px*var(--fs));color:var(--accent)}
.card p{margin:0;font-size:calc(13px*var(--fs))}
h2.sec{font-size:calc(15px*var(--fs));margin:22px 0 10px;color:var(--accent)}
.risk li{margin:6px 0}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.mini .it{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.mini .it:hover{border-color:var(--accent)}
.mini .it .t{display:flex;justify-content:space-between;gap:6px}

/* 表格 */
table{border-collapse:collapse;width:100%;font-size:calc(13px*var(--fs));background:var(--panel);border-radius:8px;overflow:hidden}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);color:var(--mute);font-weight:600;white-space:nowrap;position:sticky;top:0}
th.s{cursor:pointer}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clk{cursor:pointer} tr.clk:hover td{background:#1d222c}
.cal td:first-child{white-space:nowrap;color:var(--accent);font-weight:600;width:80px}
.fl-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fl-ctl .lab{color:var(--mute);font-size:calc(12px*var(--fs))}
.fl-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.fl-top .card b{font-variant-numeric:tabular-nums}
.fl-chart{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 0}
.fl-row{display:grid;grid-template-columns:calc(150px*var(--fs)) minmax(120px,1fr) calc(84px*var(--fs)) calc(64px*var(--fs)) calc(58px*var(--fs)) calc(70px*var(--fs)) calc(92px*var(--fs)) calc(96px*var(--fs));align-items:center;gap:8px;padding:3px 12px;cursor:pointer;font-size:calc(13px*var(--fs))}
.fl-row{min-width:calc(720px*var(--fs))}
.fl-row:hover{background:var(--panel2)}
.fl-head{color:var(--mute);font-size:calc(11px*var(--fs));cursor:default;border-bottom:1px solid var(--line);margin-bottom:2px}
.fl-head:hover{background:none}
.fl-head .r{text-align:right} .fl-head .ctr{text-align:center}
.fl-sig{font-size:calc(11px*var(--fs));white-space:nowrap}
.sg{padding:1px 6px;border-radius:8px;background:#2a303c;color:var(--mute)}
.sg.up{background:#5b1d1d;color:#ff8a8a} .sg.dn{background:#1d3a26;color:#7ccf95}
.fl-row.sel{background:#232a38;box-shadow:inset 3px 0 var(--accent)}
.fl-row .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-row .lb i{color:var(--mute);font-style:normal;font-size:calc(11px*var(--fs));margin-left:4px}
.fl-track{position:relative;height:16px}
.fl-track:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.fl-bar{position:absolute;top:2px;bottom:2px;border-radius:2px}
.fl-val{text-align:right;font-variant-numeric:tabular-nums}
.fl-daily{display:flex;align-items:center;height:110px;gap:2px;padding:0 4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;position:relative}
.fl-daily .col{flex:1;height:100%;position:relative}
.fl-daily .col i{position:absolute;left:10%;right:10%;border-radius:1px}
.fl-daily:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.gidx{height:260px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rk-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.rk-t{margin:0 0 6px;font-size:calc(14px*var(--fs))}
table.rk{font-size:calc(12.5px*var(--fs))}
table.rk th,table.rk td{padding:5px 7px}
table.rk .tg{font-size:calc(11px*var(--fs));color:var(--mute);white-space:normal;line-height:1.3}
@media(max-width:1000px){.rk-grid{grid-template-columns:1fr}}
.fl-heat{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.fl-heat table{border-collapse:separate;border-spacing:1px;background:none;border-radius:0;font-size:calc(11px*var(--fs));width:auto;min-width:100%}
.fl-heat th,.fl-heat td{padding:3px 2px;border:0;text-align:center;min-width:34px;background:none;position:static;font-variant-numeric:tabular-nums}
.fl-heat th{color:var(--mute);font-weight:400;cursor:pointer}
.fl-heat th.cur{color:var(--accent);font-weight:700}
.fl-heat td.gl{text-align:left;white-space:nowrap;padding:3px 10px;min-width:130px;color:var(--text);cursor:pointer;position:sticky;left:0;background:var(--panel)}
.fl-heat tr.sel td.gl{color:var(--accent);font-weight:600}
.fl-heat td.tot{font-weight:600;min-width:48px}
.fl-heat td[data-di]{cursor:pointer;color:#fff;font-size:calc(10px*var(--fs))}
.fl-daily.big{height:190px;margin-bottom:24px}
.fl-daily .col{cursor:pointer}
.fl-daily .col:hover,.fl-daily .col.cur{background:rgba(245,185,66,.15)}
.fl-daily .col em{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:calc(10px*var(--fs));color:var(--mute);white-space:nowrap}
.md h1{font-size:calc(20px*var(--fs));color:var(--accent);margin:4px 0 10px}
.md h2{font-size:calc(16px*var(--fs));color:var(--accent);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.md{font-size:calc(15px*var(--fs));line-height:1.85}
.md p{margin:8px 0;color:var(--text)} .md ol,.md ul{padding-left:26px;margin:8px 0} .md li{margin:10px 0}
.md table{margin:8px 0;font-size:calc(12.5px*var(--fs))} .md td,.md th{vertical-align:top}
.md .tbl{overflow:auto;margin:8px 0}
.page .tbl{overflow:auto}
.dg{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.dg h2{margin:0 0 6px;font-size:calc(17px*var(--fs));color:var(--accent)}
.dg .intro{font-size:calc(15px*var(--fs));line-height:1.75;margin:4px 0 12px}
.dg-item{border-top:1px solid var(--line);padding:10px 0}
.b5{margin:6px 0 16px;padding:10px 14px;background:#161b26;border:1px solid var(--line);border-radius:8px}
.b5 h3{margin:0 0 8px;font-size:calc(16px*var(--fs));color:var(--accent)}
.b5-row{display:grid;grid-template-columns:calc(118px*var(--fs)) minmax(0,1fr);gap:4px 14px;padding:9px 0;border-top:1px solid var(--line)}
.b5-row:first-of-type{border-top:0}
.b5-when{font-weight:700;color:#ffd27a;font-variant-numeric:tabular-nums}
.b5-row h4{margin:0 0 3px;font-size:calc(15px*var(--fs))}
.b5-row p{margin:2px 0 6px;font-size:calc(14px*var(--fs));line-height:1.75}
@media(max-width:700px){.b5-row{grid-template-columns:1fr}}
.imp-h{margin:18px 0 6px;padding-top:12px;border-top:2px solid var(--accent);font-size:calc(16px*var(--fs));color:var(--accent)}
.imp-row{display:grid;grid-template-columns:calc(150px*var(--fs)) minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
.imp-row .nm{font-weight:700;cursor:pointer}
.imp-row .nm:hover{color:var(--accent)}
.imp-row ul{margin:0;padding-left:1.2em;font-size:calc(14px*var(--fs));line-height:1.75}
.lean{display:inline-block;margin-top:4px;padding:0 10px;border-radius:10px;font-size:calc(12px*var(--fs));font-weight:600}
.lean.pos{background:#5b1d1d;color:#ff9a9a}
.lean.neg{background:#1d3a26;color:#7ccf95}
.lean.watch{background:#4a3a14;color:#ffd27a}
.lean.none{background:#262b36;color:var(--mute)}
@media(max-width:700px){.imp-row{grid-template-columns:1fr}}
.dg-item h3{margin:0 0 4px;font-size:calc(15px*var(--fs));line-height:1.5}
.dg-item .no{display:inline-block;min-width:1.7em;color:var(--accent)}
.dg-item p{margin:4px 0 6px;font-size:calc(14px*var(--fs));line-height:1.8}
.dg-item .src{font-size:calc(12px*var(--fs));color:var(--mute)}
.dg-item .src a{color:#8ec5ff;margin-right:12px;text-decoration:none}
.dg-item .src a:hover{text-decoration:underline}
.ar-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px}
.ar-card h3{margin:0 0 4px;font-size:calc(16px*var(--fs))}
.ar-card h3 .role{font-size:calc(12px*var(--fs));padding:0 8px;border-radius:10px;background:#3b2a12;color:#ffc86b;margin-left:8px;font-weight:600}
.ar-card h3 .org{font-size:calc(12px*var(--fs));color:var(--mute);font-weight:400;margin-left:8px}
.ar-why{font-size:calc(14px*var(--fs));line-height:1.75;margin:8px 0 4px}
.ar-view{font-size:calc(13px*var(--fs));line-height:1.7;color:var(--mute);margin:4px 0 0}
.star{color:var(--accent);font-weight:700}
.kp{font-size:calc(11px*var(--fs));padding:0 6px;border-radius:8px;background:#1c2a3d;color:#8ec5ff;margin-left:4px}
.nw{font-size:calc(11px*var(--fs));padding:0 6px;border-radius:8px;background:#2b2236;color:#d3a8ff;margin-left:4px}
.udn-row{display:grid;grid-template-columns:calc(52px*var(--fs)) calc(92px*var(--fs)) minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:8px 10px;border-bottom:1px solid var(--line)}
.udn-row:hover{background:var(--panel2)}
.udn-row .tm{color:var(--mute);font-variant-numeric:tabular-nums}
.udn-row .ct{font-size:calc(12px*var(--fs));color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.udn-row a{color:var(--text);text-decoration:none;font-weight:600}
.udn-row a:hover{color:var(--accent);text-decoration:underline}
.udn-row .tg{grid-column:3;display:flex;gap:6px;flex-wrap:wrap}
.udn-day{padding:6px 10px;background:#12161d;color:var(--mute);font-size:calc(12px*var(--fs));position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
.pwb{font-size:calc(11px*var(--fs));padding:0 6px;border-radius:8px;background:#3a2f12;color:#f5b942;margin-left:6px;font-weight:400}
.tagc{font-size:calc(12px*var(--fs));padding:0 8px;border-radius:10px;background:#1c2a3d;color:#8ec5ff;cursor:pointer}
.tagc.w{background:#3b2a12;color:#ffc86b}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chips button{background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:14px;padding:2px 12px;cursor:pointer;font:inherit}
.chips button.on{background:var(--panel2);color:var(--text);border-color:var(--accent)}
.udn-q{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;min-width:min(260px,100%)}
.cmpchip{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border:1px solid var(--line);border-radius:10px;cursor:pointer;white-space:nowrap;font-size:calc(12px*var(--fs))}
.cmpchip:hover{border-color:var(--accent)}
td.clk{cursor:pointer}
.note{font-size:calc(12px*var(--fs));color:var(--mute);margin-top:8px}
@media(max-width:1100px){#view{grid-template-columns:calc(220px*var(--fs)) minmax(0,1fr)} #info{display:none}}
@media(max-width:700px){#view{grid-template-columns:1fr;grid-template-rows:180px 1fr} #list{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>📈 台股看盤系統</h1>
  <nav id="nav">
    <button data-t="summary" class="on">重點摘要</button>
    <button data-t="view">看盤 K 線</button>
    <button data-t="flow">資金流向</button>
    <button data-t="rank">買超排行</button>
    <button data-t="tables">總覽表</button>
    <button data-t="cmp">台美對照</button>
    <button data-t="us">美股</button>
    <button data-t="udn">經濟日報</button>
    <button data-t="arena">台股擂台</button>
    <button data-t="digest">新聞彙整</button>
    <button data-t="calendar">行事曆 / 待追蹤</button>
  </nav>
  <div class="fsbar" title="調整文字大小"><button id="fsDown" aria-label="縮小文字">A−</button><button id="fsUp" aria-label="放大文字">A＋</button></div>
  <div class="meta" id="meta"></div>
</header>

<section class="tab on" id="t-summary"><div class="page"><div class="wrap" id="summary"></div></div></section>

<section class="tab" id="t-view">
  <div id="view">
    <aside id="list">
      <div class="tools">
        <input id="q" placeholder="搜尋代號 / 名稱">
        <select id="sortby">
          <option value="def">預設</option><option value="chg">漲幅高→低</option>
          <option value="chgd">跌幅大→小</option><option value="st">處置優先</option>
        </select>
      </div>
      <div id="rows"></div>
    </aside>
    <div id="center">
      <div id="bar">
        <span class="title" id="ttl"></span>
        <div class="seg" id="period"><button data-p="D" class="on">日K</button><button data-p="W">週K</button><button data-p="M">月K</button></div>
        <div class="seg" id="range"><button data-r="60">3月</button><button data-r="120" class="on">6月</button><button data-r="250">1年</button><button data-r="9999">全部</button></div>
        <div class="seg" id="indsel"><button data-i="KD" class="on">KD</button><button data-i="MACD">MACD</button><button data-i="VOL">量</button><button data-i="INST">法人</button></div>
        <span id="machips"></span>
      </div>
      <div id="legend"></div>
      <div id="charts">
        <div id="c-main" class="cwrap"></div>
        <div id="c-ind" class="cwrap"><span id="ind-label"></span></div>
      </div>
    </div>
    <aside id="info"></aside>
  </div>
</section>

<section class="tab" id="t-flow"><div class="page"><div class="wrap" id="flow"></div></div></section>
<section class="tab" id="t-rank"><div class="page"><div class="wrap" id="rank"></div></div></section>
<section class="tab" id="t-tables"><div class="page"><div class="wrap" id="tables"></div></div></section>
<section class="tab" id="t-cmp"><div class="page"><div class="wrap" id="cmp"></div></div></section>

<section class="tab" id="t-arena"><div class="page"><div class="wrap" id="arena"></div></div></section>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
// 文字大小(給視力不佳者):預設 1.3 倍,可用右上角 A−/A＋ 調整,並記在瀏覽器
const FS_STEPS = [1, 1.15, 1.3, 1.5, 1.75, 2];
let FS = 1.3;
try { const v = parseFloat(localStorage.getItem("stock_fs")); if(v >= 0.9 && v <= 2.2) FS = v; } catch(e) {}
document.documentElement.style.setProperty("--fs", FS);
const PRICES = window.PRICES || {};
const US = window.US || null, US_NAMES = {};
if(US){ for(const [k,v] of Object.entries(US.series)){ PRICES[k] = {symbol:k, rows:v.r}; US_NAMES[k] = v.n; } }
const isUS = c => Object.prototype.hasOwnProperty.call(US_NAMES, c);
const volText = (c, v) => isUS(c) ? (v >= 1e6 ? (v/1e6).toFixed(2) + " 百萬股" : v.toLocaleString("en-US") + " 股") : v.toLocaleString("en-US") + " 張";
const WL = window.WATCHLIST, REF = window.REFERENCE, S = window.SUMMARY;
const ST = {disposal:"處置中", disposalNext:"即將處置", notice:"注意股", normal:"正常"};
const ST_ORDER = {disposal:0, disposalNext:1, notice:2, normal:3};
const UP = "#ef4444", DN = "#22c55e";
const MAS = [{n:5,c:"#f5b942"},{n:10,c:"#4f9cf9"},{n:20,c:"#c084fc"},{n:60,c:"#2dd4bf"}];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n, d=2) => n==null ? "—" : Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = n => n==null ? "—" : (n>0?"+":"")+n.toFixed(2)+"%";
const cls = n => n>0 ? "up" : n<0 ? "dn" : "";

const meta = window.PRICES_META || {};
$("#meta").textContent = `彙整 ${window.WATCH_META.asof} · 股價資料至 ${(PRICES.TWII?PRICES.TWII.rows.at(-1)[0]:"—")}(抓取 ${meta.updated||"—"})`;

// ---------- 分頁 ----------
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x===b));
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.id==="t-"+b.dataset.t));
  if(b.dataset.t==="view") { renderChart(); resizeCharts(); }
  if(b.dataset.t==="flow") renderFlow();
  if(b.dataset.t==="us") renderUS();
  if(b.dataset.t==="cmp") renderCmp();
  if(b.dataset.t==="udn") renderUdn();
  if(b.dataset.t==="rank") renderRank();
  if(b.dataset.t==="arena") renderArena();   // 分頁顯示後才畫圖,避免寬度為 0
});
// 依需要載入個股日 K(data/k/{代號}.js);自選股已在 prices.js 內
const kLoading = {};
function loadK(code){
  if(PRICES[code]) return Promise.resolve();
  if(kLoading[code]) return kLoading[code];
  const addScript = src => new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  return kLoading[code] = (async () => {
    try { await addScript(`data/k/${code}.js`); }
    catch(e) {   // 公開站為節省空間,K 線分成「歷史」與「本月」兩檔
      await Promise.all([addScript(`data/k/${code}.h.js`), addScript(`data/k/${code}.r.js`)]);
    }
    const k = (window.KDATA||{})[code], h = (window.KDATA_H||{})[code], r = (window.KDATA_R||{})[code];
    if(k){ PRICES[code] = {symbol:k.s, rows:k.r}; return; }
    if(h && r){ PRICES[code] = {symbol:r.s, rows:h.r.concat(r.r)}; return; }
    throw new Error("no K");
  })().catch(e => { delete kLoading[code]; throw e; });
}
function nameOf(code){
  if(US_NAMES[code]) return US_NAMES[code];
  const w = WL.concat(REF).find(s=>s.code===code); if(w) return w.name;
  const f = window.FLOW && window.FLOW.stocks[code]; return f ? f.n : code;
}
function gotoStock(code){
  document.querySelector('#nav button[data-t="view"]').click();
  select(code);
}

// ---------- 資料處理 ----------
function lastInfo(code){
  const d = PRICES[code]; if(!d) return null;
  const r = d.rows, n = r.length, c = r[n-1][4], p = n>1 ? r[n-2][4] : c;
  return {c, chg:c-p, pct:(c-p)/p*100, date:r[n-1][0], vol:r[n-1][5]};
}
function bucket(mode, d){
  if(mode==="D") return d;
  if(mode==="M") return d.slice(0,7);
  const t = new Date(d+"T00:00:00Z"), day = (t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day);
  return t.toISOString().slice(0,10);
}
function aggregate(rows, mode){
  if(mode==="D") return rows;
  const out = [], key = d => bucket(mode, d);
  let cur=null, k=null;
  for(const r of rows){
    const kk = key(r[0]);
    if(kk!==k){ if(cur) out.push(cur); cur=[r[0],r[1],r[2],r[3],r[4],r[5]]; k=kk; }
    else { cur[0]=r[0]; cur[2]=Math.max(cur[2],r[2]); cur[3]=Math.min(cur[3],r[3]); cur[4]=r[4]; cur[5]+=r[5]; }
  }
  if(cur) out.push(cur);
  return out;
}
function sma(rows, n){
  const out=[]; let s=0;
  for(let i=0;i<rows.length;i++){
    s+=rows[i][4]; if(i>=n) s-=rows[i-n][4];
    if(i>=n-1) out.push({time:rows[i][0], value:+(s/n).toFixed(2)});
  }
  return out;
}
function boll(rows, n=20, k=2){
  const U=[],L=[];
  for(let i=n-1;i<rows.length;i++){
    let m=0; for(let j=i-n+1;j<=i;j++) m+=rows[j][4]; m/=n;
    let v=0; for(let j=i-n+1;j<=i;j++) v+=(rows[j][4]-m)**2;
    const sd=Math.sqrt(v/n);
    U.push({time:rows[i][0],value:+(m+k*sd).toFixed(2)}); L.push({time:rows[i][0],value:+(m-k*sd).toFixed(2)});
  }
  return {U,L};
}
// 副圖資料與主圖 K 棒一一對齊(暖機期補空白點),否則時間軸同步會錯位
function pad(data){
  const m = new Map(data.map(d=>[d.time,d]));
  return viewRows.map(r => m.get(r[0]) || {time:r[0]});
}
function instSrc(code){
  const src = (window.INST||{})[code]; if(src) return {m:src, unit:"張"};
  const F = window.FLOW, st = F && F.stocks[code]; if(!st || !st.d) return null;
  const m = {}; F.days.forEach((d,i) => m[d] = st.d[i]); return {m, unit:"億"};
}
function instAgg(code){
  const is = instSrc(code); if(!is) return null;
  const src = is.m, acc = {};
  for(const d of Object.keys(src)){ const k = bucket(period,d), a = acc[k]||(acc[k]=[0,0,0]);
    a[0]+=src[d][0]; a[1]+=src[d][1]; a[2]+=src[d][2]; }
  const out = viewRows.map(r => { const a = acc[bucket(period,r[0])]; return a ? {time:r[0],f:a[0],t:a[1],d:a[2]} : {time:r[0]}; });
  out.unit = is.unit; return out;
}
function kd(rows, n=9){
  const K=[],D=[]; let k=50,d=50;
  for(let i=0;i<rows.length;i++){
    if(i<n-1) continue;
    let hi=-Infinity, lo=Infinity;
    for(let j=i-n+1;j<=i;j++){ hi=Math.max(hi,rows[j][2]); lo=Math.min(lo,rows[j][3]); }
    const rsv = hi===lo ? 50 : (rows[i][4]-lo)/(hi-lo)*100;
    k = k*2/3 + rsv/3; d = d*2/3 + k/3;
    K.push({time:rows[i][0], value:+k.toFixed(2)}); D.push({time:rows[i][0], value:+d.toFixed(2)});
  }
  return {K,D};
}
function ema(vals, n){ const a=2/(n+1); const out=[]; let e=null;
  vals.forEach((v,i)=>{ e = e===null ? v : v*a + e*(1-a); out.push(e); }); return out; }
function macd(rows){
  const cl = rows.map(r=>r[4]), e12=ema(cl,12), e26=ema(cl,26);
  const dif = cl.map((_,i)=>e12[i]-e26[i]), dea = ema(dif,9);
  const D=[],E=[],H=[];
  for(let i=25;i<rows.length;i++){
    const t=rows[i][0], h=(dif[i]-dea[i])*2;
    D.push({time:t,value:+dif[i].toFixed(3)}); E.push({time:t,value:+dea[i].toFixed(3)});
    H.push({time:t,value:+h.toFixed(3),color:h>=0?UP:DN});
  }
  return {D,E,H};
}

// ---------- 左側清單 ----------
let current = "6213", period="D", rangeN=120, indMode="KD";
const maOn = {5:true,10:true,20:true,60:true};
let bbOn = true, S_bu, S_bl, bbData = null;

function renderList(){
  const q = $("#q").value.trim().toLowerCase(), sort = $("#sortby").value;
  let items = WL.filter(s => !q || s.code.toLowerCase().includes(q) || s.name.toLowerCase().includes(q));
  const li = c => (lastInfo(c)||{pct:0}).pct;
  if(sort==="chg") items.sort((a,b)=>li(b.code)-li(a.code));
  else if(sort==="chgd") items.sort((a,b)=>li(a.code)-li(b.code));
  else if(sort==="st") items.sort((a,b)=>ST_ORDER[a.status]-ST_ORDER[b.status]);
  const row = (code,name,status) => {
    const i = lastInfo(code);
    return `<div class="row ${code===current?'sel':''}" data-c="${code}">
      <div><span class="nm">${esc(name)}</span><span class="cd">${esc(code)}</span></div>
      <div class="px ${cls(i&&i.chg)}">${i?fmt(i.c):'—'}</div>
      <div class="sub">${status?`<span class="pill ${status}">${ST[status]}</span>`:''}</div>
      <div class="px sub ${cls(i&&i.chg)}">${i?pct(i.pct):''}</div></div>`;
  };
  let html = `<div class="grp">自選股 ${items.length} 檔</div>` + items.map(s=>row(s.code,s.name,s.status)).join("");
  const refs = REF.filter(r => !q || r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
  if(refs.length) html += `<div class="grp">大盤 / 參考</div>` + refs.map(r=>row(r.code,r.name,null)).join("");
  const F = window.FLOW, inList = c => WL.some(s=>s.code===c) || REF.some(r=>r.code===c);
  const mk = (c) => { const x = F.stocks[c];
    return `<div class="row ${c===current?'sel':''}" data-c="${c}"><div><span class="nm">${esc(x.n)}</span><span class="cd">${c}</span></div>
      <div class="px">${fmt(x.c)}</div><div class="sub">${esc(x.i)}</div><div class="px sub ${cls(x.r)}">${x.r==null?"":"20日 "+pct(x.r)}</div></div>`; };
  if(F && current && !inList(current) && F.stocks[current] && !q) html = `<div class="grp">目前檢視</div>` + mk(current) + html;
  if(F && q){
    const hits = Object.keys(F.stocks).filter(c => !inList(c) && F.stocks[c].i && (c.startsWith(q) || F.stocks[c].n.toLowerCase().includes(q))).slice(0, 40);
    if(hits.length) html += `<div class="grp">全市場搜尋 ${hits.length}${hits.length===40?"+":""} 檔</div>` + hits.map(mk).join("");
  }
  if(US && current && isUS(current) && !inList(current) && !q) html = `<div class="grp">目前檢視</div>` + row(current, US_NAMES[current], null) + html;
  if(US && q){
    const hs = Object.keys(US_NAMES).filter(k => !inList(k) && (k.toLowerCase().includes(q) || US_NAMES[k].toLowerCase().includes(q))).slice(0, 20);
    if(hs.length) html += `<div class="grp">美股搜尋 ${hs.length} 檔</div>` + hs.map(k => row(k, US_NAMES[k], null)).join("");
  }
  $("#rows").innerHTML = html;
}
$("#rows").addEventListener("click", e => { const r=e.target.closest(".row"); if(r) select(r.dataset.c); });
$("#q").addEventListener("input", renderList);
$("#sortby").addEventListener("change", renderList);

function select(code){
  current = code; renderList(); renderInfo();
  if(PRICES[code]){ renderChart(); return; }
  initCharts(); S_c.setData([]); S_v.setData([]);
  $("#ttl").textContent = `${nameOf(code)} ${code}`; $("#legend").textContent = "載入日 K 中…";
  loadK(code).then(() => { if(current===code){ renderChart(); renderInfo(); renderList(); } })
             .catch(() => { if(current===code){ renderChart();
               $("#legend").innerHTML = `此公開版未收錄該股 K 線 · <a href="https://tw.stock.yahoo.com/quote/${code}" target="_blank" rel="noopener" style="color:var(--accent)">到 Yahoo 股市看 ${esc(nameOf(code))} ${code}</a>`; } });
}

// ---------- 圖表 ----------
let mainChart, indChart, S_c, S_v, S_ma = {}, S_i = [], syncing=false;
const chartOpts = h => ({
  layout:{background:{color:"#0f1218"},textColor:"#aeb7c6",fontFamily:"Microsoft JhengHei, sans-serif",fontSize:Math.round(12*FS)},
  grid:{vertLines:{color:"#1a1f29"},horzLines:{color:"#1a1f29"}},
  rightPriceScale:{borderColor:"#2a303c"}, timeScale:{borderColor:"#2a303c",rightOffset:6,timeVisible:false},
  crosshair:{mode:0}, localization:{locale:"zh-TW"},
});
function initCharts(){
  if(mainChart) return;
  mainChart = LightweightCharts.createChart($("#c-main"), chartOpts());
  indChart  = LightweightCharts.createChart($("#c-ind"), chartOpts());
  S_c = mainChart.addCandlestickSeries({upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,
    priceFormat:{type:"price",precision:2,minMove:0.01}});
  mainChart.priceScale("right").applyOptions({scaleMargins:{top:0.06,bottom:0.24}});
  S_v = mainChart.addHistogramSeries({priceScaleId:"vol",priceFormat:{type:"volume"},lastValueVisible:false,priceLineVisible:false});
  mainChart.priceScale("vol").applyOptions({scaleMargins:{top:0.82,bottom:0}});
  MAS.forEach(m => { S_ma[m.n] = mainChart.addLineSeries({color:m.c,lineWidth:1,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false}); });

  const bbOpt = {color:"rgba(148,163,184,.9)",lineWidth:1,lineStyle:2,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false};
  S_bu = mainChart.addLineSeries(bbOpt); S_bl = mainChart.addLineSeries(bbOpt);
  // 時間軸同步
  const link = (a,b) => a.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if(syncing||!r) return; syncing=true; try{ b.timeScale().setVisibleLogicalRange(r);}catch(e){} syncing=false; });
  link(mainChart, indChart); link(indChart, mainChart);
  // 十字線同步 + 圖例
  mainChart.subscribeCrosshairMove(p => {
    updateLegend(p);
    if(!p || !p.time){ indChart.clearCrosshairPosition(); return; }
    const first = S_i[0]; if(first) indChart.setCrosshairPosition(0, p.time, first);
  });
  indChart.subscribeCrosshairMove(p => {
    if(!p || !p.time){ mainChart.clearCrosshairPosition(); return; }
    mainChart.setCrosshairPosition(0, p.time, S_c); updateLegend(p);
  });
  new ResizeObserver(resizeCharts).observe($("#charts"));
}
function resizeCharts(){
  if(!mainChart) return;
  const m=$("#c-main"), i=$("#c-ind");
  mainChart.applyOptions({width:m.clientWidth,height:m.clientHeight});
  indChart.applyOptions({width:i.clientWidth,height:i.clientHeight});
}
let viewRows = [], maData = {};
function renderChart(){
  initCharts();
  const d = PRICES[current], name = nameOf(current);
  $("#ttl").textContent = `${name} ${current}`;
  if(!d){ S_c.setData([]); S_v.setData([]); $("#legend").textContent="無股價資料"; return; }
  viewRows = aggregate(d.rows, period);
  S_c.setData(viewRows.map(r=>({time:r[0],open:r[1],high:r[2],low:r[3],close:r[4]})));
  S_v.setData(viewRows.map(r=>({time:r[0],value:r[5],color:r[4]>=r[1]?"rgba(239,68,68,.55)":"rgba(34,197,94,.55)"})));
  MAS.forEach(m => { maData[m.n] = sma(viewRows, m.n); S_ma[m.n].setData(maOn[m.n]?maData[m.n]:[]); });
  bbData = boll(viewRows);
  S_bu.setData(bbOn?bbData.U:[]); S_bl.setData(bbOn?bbData.L:[]);
  renderInd();
  const n = viewRows.length, show = Math.min(n, period==="D" ? rangeN : period==="W" ? Math.ceil(rangeN/5) : Math.ceil(rangeN/21));
  const r = {from:n-show-1, to:n+5};
  mainChart.timeScale().setVisibleLogicalRange(r); indChart.timeScale().setVisibleLogicalRange(r);
  updateLegend(null);
  resizeCharts();
}
function renderInd(){
  S_i.forEach(s => indChart.removeSeries(s)); S_i = [];
  const lab = $("#ind-label");
  const add = (type, opt, data) => { const s = indChart[type](opt); s.setData(data); S_i.push(s); return s; };
  if(indMode==="KD"){
    const {K,D} = kd(viewRows);
    add("addLineSeries",{color:"#f5b942",lineWidth:1,title:"K",priceLineVisible:false}, pad(K));
    add("addLineSeries",{color:"#4f9cf9",lineWidth:1,title:"D",priceLineVisible:false}, pad(D));
    lab.textContent = "KD(9,3,3)";
  } else if(indMode==="MACD"){
    const {D,E,H} = macd(viewRows);
    add("addHistogramSeries",{priceLineVisible:false,lastValueVisible:false}, pad(H));
    add("addLineSeries",{color:"#f5b942",lineWidth:1,title:"DIF",priceLineVisible:false}, pad(D));
    add("addLineSeries",{color:"#4f9cf9",lineWidth:1,title:"MACD",priceLineVisible:false}, pad(E));
    lab.textContent = "MACD(12,26,9)";
  } else if(indMode==="VOL"){
    add("addHistogramSeries",{priceFormat:{type:"volume"},priceLineVisible:false},
      viewRows.map(r=>({time:r[0],value:r[5],color:r[4]>=r[1]?UP:DN})));
    add("addLineSeries",{color:"#f5b942",lineWidth:1,priceLineVisible:false,lastValueVisible:false},
      pad(volMA(viewRows,5)));
    lab.textContent = "成交量(張)· 5 期均量";
  } else {
    const a = instAgg(current);
    if(!a){ lab.textContent = "法人買賣超:此標的無資料(請執行更新法人資料.bat)"; }
    else {
      const sum = x => x.f+x.t+x.d;
      add("addHistogramSeries",{priceLineVisible:false,lastValueVisible:false,priceFormat:{type:"volume"}},
        a.map(x=> x.f==null ? {time:x.time} : {time:x.time,value:sum(x),color:sum(x)>=0?"rgba(239,68,68,.45)":"rgba(34,197,94,.45)"}));
      add("addLineSeries",{color:"#f5b942",lineWidth:1,title:"外資",priceLineVisible:false,lastValueVisible:false}, a.map(x=>x.f==null?{time:x.time}:{time:x.time,value:x.f}));
      add("addLineSeries",{color:"#4f9cf9",lineWidth:1,title:"投信",priceLineVisible:false,lastValueVisible:false}, a.map(x=>x.t==null?{time:x.time}:{time:x.time,value:x.t}));
      add("addLineSeries",{color:"#c084fc",lineWidth:1,title:"自營",priceLineVisible:false,lastValueVisible:false}, a.map(x=>x.d==null?{time:x.time}:{time:x.time,value:x.d}));
      lab.textContent = `三大法人買賣超(${a.unit}):柱=合計,線=外資/投信/自營`;
    }
  }
}
function volMA(rows,n){ const o=[]; let s=0; for(let i=0;i<rows.length;i++){ s+=rows[i][5]; if(i>=n) s-=rows[i-n][5]; if(i>=n-1) o.push({time:rows[i][0],value:Math.round(s/n)}); } return o; }

function updateLegend(p){
  let idx = viewRows.length-1;
  if(p && p.time){ const i = viewRows.findIndex(r=>r[0]===p.time); if(i>=0) idx=i; }
  const r = viewRows[idx]; if(!r) return;
  const prev = viewRows[idx-1], chg = prev ? r[4]-prev[4] : 0, pc = prev ? chg/prev[4]*100 : 0, c = cls(chg);
  let h = `<b>${r[0]}</b>  開 ${fmt(r[1])}  高 ${fmt(r[2])}  低 ${fmt(r[3])}  收 <span class="${c}">${fmt(r[4])}</span>  <span class="${c}">${chg>=0?"+":""}${fmt(chg)} (${pct(pc)})</span>  量 ${volText(current, r[5])}  `;
  MAS.forEach(m => { if(!maOn[m.n]) return; const x = maData[m.n].find(v=>v.time===r[0]); if(x) h += `<span style="color:${m.c}">MA${m.n} ${fmt(x.value)}</span>  `; });
  if(bbOn && bbData){ const u=bbData.U.find(v=>v.time===r[0]), l=bbData.L.find(v=>v.time===r[0]);
    if(u&&l) h += `<span style="color:#94a3b8">BB ${fmt(u.value)} / ${fmt(l.value)}</span>  `; }

// ---------- 台美對照 ----------
let cmpMemo = null;
function cmpPrep(){
  if(cmpMemo) return cmpMemo;
  const ret = rows => { const m = new Map(); for(let i=1;i<rows.length;i++) m.set(rows[i][0], rows[i][4]/rows[i-1][4]-1); return m; };
  const close = rows => new Map(rows.map(r => [r[0], r[4]]));
  const usRet = {}, usClose = {};
  for(const k of Object.keys(US.series)){ usRet[k] = ret(US.series[k].r); usClose[k] = close(US.series[k].r); }
  const usDates = US.series["^GSPC"].r.map(r => r[0]);       // 美股交易日(排除週末的加密貨幣日)
  const prevUS = d => { let lo = 0, hi = usDates.length - 1, ans = null;   // 嚴格早於 d 的最近美股交易日
    while(lo <= hi){ const m = (lo+hi) >> 1; if(usDates[m] < d){ ans = usDates[m]; lo = m+1; } else hi = m-1; } return ans; };
  return cmpMemo = {usRet, usClose, usDates, prevUS};
}
const corr = (a, b) => { const n = a.length; if(n < 30) return null;
  const ma = a.reduce((x,y)=>x+y,0)/n, mb = b.reduce((x,y)=>x+y,0)/n; let sab=0, saa=0, sbb=0;
  for(let i=0;i<n;i++){ const da=a[i]-ma, db=b[i]-mb; sab+=da*db; saa+=da*da; sbb+=db*db; } return saa&&sbb ? sab/Math.sqrt(saa*sbb) : null; };
const gain = (rows, m) => rows.length > m ? (rows[rows.length-1][4]/rows[rows.length-1-m][4]-1)*100 : null;

function renderCmp(){
  const el = $("#cmp");
  if(!US || !window.US_MAP){ el.innerHTML = '<div class="headline">尚無美股對照資料,請先執行 fetch_us.py。</div>'; return; }
  const P = cmpPrep(), MAP = window.US_MAP;
  const pc = v => v==null ? "—" : pct(v), num = v => v==null ? "—" : fmt(v);
  const usStat = k => { const r = US.series[k].r; return {k, n:US.series[k].n, c:r.at(-1)[4], d:gain(r,1), w:gain(r,5), m:gain(r,20)}; };
  const avg = a => { const v = a.filter(x=>x!=null); return v.length ? v.reduce((x,y)=>x+y,0)/v.length : null; };

  // 一、族群對照
  const themeRows = (window.US_THEME_MAP || []).map(([tw, ug]) => {
    const gi = window.GINDEX && GINDEX.theme[tw]; const grp = US.groups.find(g => g.name === ug);
    if(!gi || !grp) return null;
    const tr = i => i >= gi.length ? null : null;
    const twG = m => gi.length > m ? (gi.at(-1)/gi.at(-1-m)-1)*100 : null;
    // 美股群組等權指數
    const syms = grp.items.filter(k => k !== "^SOX" && k !== "SMH" && k !== "SOXX");
    const idx = [100]; const dates = P.usDates.slice(-130);
    for(let i=1;i<dates.length;i++){ const rs = syms.map(k => P.usRet[k].get(dates[i])).filter(x => x!=null); idx.push(idx.at(-1)*(1+(rs.length ? rs.reduce((x,y)=>x+y,0)/rs.length : 0))); }
    const uG = m => idx.length > m ? (idx.at(-1)/idx.at(-1-m)-1)*100 : null;

// 由最新一天往回數連續買超(正)或賣超(負)的交易日數;最新一天為 0 則回傳 0
function streak(arr){
  if(!arr || !arr.length) return 0;
  const last = arr[arr.length-1]; if(!last) return 0;
  const sg = last > 0 ? 1 : -1; let n = 0;
  for(let i = arr.length-1; i >= 0 && arr[i]*sg > 0; i--) n++;
  return sg*n;
}
const streakTxt = v => v===0 ? '<span class="mute">—</span>' : `<span class="${v>0?'up':'dn'}">${v>0?"買 ":"賣 "}${Math.abs(v)}</span>`;
function epsNum(txt){            // 自選股的明年 EPS 預估文字 → 數字(範圍取中間值)
  if(!txt || txt === "—") return null;
  const nums = (String(txt).match(/\d+(?:\.\d+)?/g) || []).map(Number);
  if(!nums.length) return null;
  return String(txt).includes("~") && nums.length >= 2 ? (nums[0]+nums[1])/2 : nums[0];
}

// ---------- 新聞彙整(把 台股新聞彙整.md 轉成簡易 HTML) ----------
function mdToHtml(src){
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = []; let list = null, tbl = null;
  const flush = () => { if(list){ out.push(`</${list}>`); list = null; } if(tbl){ out.push("</tbody></table></div>"); tbl = null; } };
  for(const raw of src.split("\n")){
    const l = raw.trimEnd();
    let m;
    if(!l.trim()){ flush(); continue; }
    if((m = l.match(/^(#{1,3})\s+(.*)/))){ flush(); out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); continue; }
    if(l.startsWith("|")){
      const cells = l.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;
      if(!tbl){ flush(); tbl = true; out.push(`<div class="tbl"><table><thead><tr>${cells.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>`); }
      else out.push(`<tr>${cells.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`);
      continue;
    }
    if((m = l.match(/^\d+\.\s+(.*)/))){ if(list!=="ol"){ flush(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    if((m = l.match(/^[-*]\s+(.*)/))){ if(list!=="ul"){ flush(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    flush(); out.push(`<p>${inl(l)}</p>`);
  }
  flush(); return out.join("\n");
}

  const el = $("#digest"), d = window.DIGEST;
  el.innerHTML = d ? `<div class="md">${mdToHtml(d)}</div>` : `<div class="headline">尚無新聞彙整資料(data/digest.js)。</div>`;

// ---------- 資金流向 ----------
let flowCat = "theme", flowWin = 5, flowWho = "all", flowSel = null, flowMode = "day", flowDay = null, flowTop = 20, flowSort = "v";
const WHO = {all:"三大法人", f:"外資", t:"投信", d:"自營商"};
function renderFlow(){
  const F = window.FLOW, el = $("#flow");
  if(!F){ el.innerHTML = '<div class="headline">尚無資金流向資料,請先執行 update_all.bat。</div>'; return; }
  const idx = {f:0,t:1,d:2}, nD = F.days.length;
  if(flowDay==null || flowDay>=nD) flowDay = nD-1;
  const val = a => flowWho==="all" ? a[0]+a[1]+a[2] : a[idx[flowWho]];
  const cat = F[flowCat], day = flowMode==="day";
  const f1 = n => (n>0?"+":"")+n.toLocaleString("en-US",{maximumFractionDigits:1})+" 億";
  const md = d => d.slice(5).replace("-","/");
  const wd = d => "日一二三四五六"[new Date(d+"T00:00:00Z").getUTCDay()];
  // 族群指數與月線(MA20)
  const GI = window.GINDEX, endDate = F.days[day ? flowDay : nD-1], gi = GI ? GI.dates.indexOf(endDate) : -1;
  const avg = (x, i, j) => { let a = 0; for(let k=i;k<=j;k++) a += x[k]; return a/(j-i+1); };
  const maInfo = g => { const x = GI && GI[flowCat] && GI[flowCat][g]; if(!x || gi < 19) return null;
    const v = x[gi], m20 = avg(x,gi-19,gi), m60 = gi>=59 ? avg(x,gi-59,gi) : null;
    return {v, m20, m60, bias:(v/m20-1)*100, bias60:m60?(v/m60-1)*100:null}; };
  const rows = Object.entries(cat).filter(([g,o]) => o.codes.length >= (flowCat==="theme"?1:3)).map(([g,o]) => {
    let t;
    if(day) t = o.daily[flowDay];
    else { t = [0,0,0]; o.codes.forEach(c => { const w = F.stocks[c].w[flowWin]; for(let k=0;k<3;k++) t[k]+=w[k]; }); }
    // 成交值占比、占比變化、漲跌幅(別人常用的「量價」面向)
    const n = day ? 1 : flowWin, end = day ? flowDay : nD-1, a0 = end-n+1;
    const sm = (arr, i, j) => { let x = 0; for(let k=i;k<=j;k++) x += arr[k]||0; return x; };
    const share = sm(o.tv,a0,end)/Math.max(1,sm(F.mkt,a0,end))*100;
    let prev = null;
    if(day){ if(end>=5){ let x=0; for(let k=end-5;k<end;k++) x += o.tv[k]/Math.max(1,F.mkt[k])*100; prev = x/5; } }
    else if(a0-n >= 0) prev = sm(o.tv,a0-n,a0-1)/Math.max(1,sm(F.mkt,a0-n,a0-1))*100;
    let ret = 0, has = false;
    for(let k=a0;k<=end;k++){ const r = o.rt[k]; if(r!=null){ ret = (1+ret/100)*(1+r/100)*100-100; has = true; } }
    return {g, v:val(t), f:t[0], t:t[1], d:t[2], n:o.codes.length, tv:sm(o.tv,a0,end), share, ds:prev==null?null:share-prev, ret:has?ret:null, ma:maInfo(g)};
  });
  const byV = rows.slice().sort((a,b)=>b.v-a.v);
  const SK = {v:r=>r.v, share:r=>r.share, ds:r=>r.ds==null?-1e9:r.ds, ret:r=>r.ret==null?-1e9:r.ret, bias:r=>r.ma?r.ma.bias:-1e9};
  rows.sort((a,b)=>SK[flowSort](b)-SK[flowSort](a));
  if(!flowSel || !cat[flowSel]) flowSel = rows[0] && rows[0].g;
  const mx = Math.max(1, ...rows.map(r=>Math.abs(r.v)));
  const seg = (id, items, cur) => `<div class="seg" data-id="${id}">${items.map(([k,t])=>`<button data-k="${k}" class="${String(cur)===String(k)?'on':''}">${t}</button>`).join("")}</div>`;
  const top = byV.slice(0,3), bot = byV.slice(-3).reverse();
  const chips = (a, c) => a.map(r=>`<span class="${c}"><b>${esc(r.g)}</b> ${f1(r.v)}</span>`).join(" · ");
  const inflow = rows.filter(r=>r.v>0).reduce((a,r)=>a+r.v,0), outflow = rows.filter(r=>r.v<0).reduce((a,r)=>a+r.v,0);
  const dayTitle = `${F.days[flowDay]}(週${wd(F.days[flowDay])})`;
  const sig = r => {
    if(r.ret==null) return "";
    const px_ = r.ret>0, ch = r.v>0;
    if(ch && px_ && (r.ds==null || r.ds>=0)) return '<span class="sg up" title="法人買超、股價上漲、成交占比未縮">量價籌碼齊揚</span>';
    if(!ch && !px_) return '<span class="sg dn" title="法人賣超且股價下跌">資金撤出</span>';
    return '<span class="sg" title="法人與股價方向不同">背離</span>';
  };
  const bars = `<div class="fl-row fl-head"><div>族群</div><div class="ctr">法人淨買賣超(合計 = 外資+投信+自營)</div><div class="r">金額</div>
      <div class="r">漲跌</div><div class="r">成交占比</div><div class="r">占比增減</div><div class="r">月線 MA20</div><div>訊號</div></div>` + rows.map(r => {
    const w = Math.abs(r.v)/mx*50, up = r.v>=0;
    return `<div class="fl-row ${r.g===flowSel?'sel':''}" data-g="${esc(r.g)}"><div class="lb">${esc(r.g)}<i>${r.n} 檔</i></div>
      <div class="fl-track"><div class="fl-bar" style="${up?`left:50%;`:`right:50%;`}width:${w}%;background:${up?UP:DN}"></div></div>
      <div class="fl-val ${cls(r.v)}">${f1(r.v)}</div>
      <div class="fl-val ${cls(r.ret)}">${r.ret==null?"—":pct(r.ret)}</div>
      <div class="fl-val">${r.share.toFixed(1)}%</div>
      <div class="fl-val ${cls(r.ds)}">${r.ds==null?"—":(r.ds>0?"+":"")+r.ds.toFixed(2)+"pt"}</div>
      <div class="fl-val ${r.ma?(r.ma.bias>=0?'up':'dn'):''}">${r.ma?(r.ma.bias>=0?"站上 ":"跌破 ")+(r.ma.bias>0?"+":"")+r.ma.bias.toFixed(1)+"%":"—"}</div>
      <div class="fl-sig">${sig(r)}</div></div>`;
  }).join("");

  // 熱度圖:族群 × 近 20 日
  const HD = Math.min(20, nD), h0 = nD-HD;
  const hrows = Object.entries(cat).filter(([g,o]) => o.codes.length >= (flowCat==="theme"?1:3))
    .map(([g,o]) => ({g, ser:o.daily.slice(h0).map(val)})).sort((a,b)=>b.ser.reduce((x,y)=>x+y,0)-a.ser.reduce((x,y)=>x+y,0));
  const abs = hrows.flatMap(r=>r.ser.map(Math.abs)).sort((a,b)=>a-b), cap = Math.max(1, abs[Math.floor(abs.length*0.92)]||1);
  const heat = `<div class="fl-heat"><table><thead><tr><th></th>${F.days.slice(h0).map((d,i)=>`<th class="${h0+i===flowDay?'cur':''}" data-di="${h0+i}">${md(d)}</th>`).join("")}<th>合計</th></tr></thead><tbody>
    ${hrows.map(r=>`<tr data-g="${esc(r.g)}" class="${r.g===flowSel?'sel':''}"><td class="gl">${esc(r.g)}</td>${r.ser.map((v,i)=>{
      const a = Math.min(1, Math.abs(v)/cap), col = v>=0 ? `rgba(239,68,68,${(.1+a*.85).toFixed(2)})` : `rgba(34,197,94,${(.1+a*.85).toFixed(2)})`;
      return `<td data-di="${h0+i}" style="background:${col}" title="${esc(r.g)} ${F.days[h0+i]}:${f1(v)}">${Math.abs(v)>=cap*.35?Math.round(v):""}</td>`}).join("")}
      <td class="tot ${cls(r.ser.reduce((x,y)=>x+y,0))}">${Math.round(r.ser.reduce((x,y)=>x+y,0))}</td></tr>`).join("")}</tbody></table></div>`;

  // 個股資金流入 / 流出排行榜(全市場)
  const tmap = {};
  Object.entries(F.theme).forEach(([g,o]) => o.codes.forEach(c => (tmap[c] = tmap[c]||[]).push(g)));
  const allS = Object.entries(F.stocks).filter(([c,s]) => s.i).map(([c,s]) => { const a = day ? s.d[flowDay] : s.w[flowWin]; return {c, s, a, v:val(a)}; });
  const rin = allS.filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0, flowTop);
  const rout = allS.filter(x=>x.v<0).sort((a,b)=>a.v-b.v).slice(0, flowTop);
  const rk = (list, title, tone) => `<div><h3 class="rk-t ${tone}">${title}</h3><table class="rk"><thead><tr><th>#</th><th>個股</th><th class="n">收盤</th><th class="n">20日</th>
      <th class="n">外資</th><th class="n">投信</th><th class="n">自營</th><th class="n">合計(億)</th></tr></thead><tbody>
      ${list.map((x,i)=>`<tr class="clk" data-c="${x.c}"><td class="mute">${i+1}</td>
        <td><b>${esc(x.s.n)}</b> <span class="mute">${x.c}</span><div class="tg">${esc(x.s.i)}${(tmap[x.c]||[]).slice(0,3).map(g=>` · ${esc(g)}`).join("")}</div></td>
        <td class="n">${fmt(x.s.c)}</td><td class="n ${cls(x.s.r)}">${x.s.r==null?"—":pct(x.s.r)}</td>
        <td class="n ${cls(x.a[0])}">${fmt(x.a[0],1)}</td><td class="n ${cls(x.a[1])}">${fmt(x.a[1],1)}</td><td class="n ${cls(x.a[2])}">${fmt(x.a[2],1)}</td>
        <td class="n ${cls(x.v)}"><b>${fmt(x.v,1)}</b></td></tr>`).join("")}</tbody></table></div>`;
  const ranking = `<h2 class="sec">個股資金流入 / 流出排行榜 · ${day?dayTitle:`近 ${flowWin} 日累計`} · ${WHO[flowWho]}</h2>
    <div class="fl-ctl"><span class="lab">顯示筆數</span>${seg("topn", [[10,"前 10"],[20,"前 20"],[50,"前 50"]], flowTop)}
      <span class="mute" style="font-size:calc(12px*var(--fs))">全市場上市櫃共 ${allS.length} 檔;金額單位:億元;點任一檔個股會跳到看盤並載入 K 線</span></div>
    <div class="rk-grid">${rk(rin, "資金流入排行", "up")}${rk(rout, "資金流出排行", "dn")}</div>`;

  // 選定族群:每日流向圖與成分股
  let detail = "";
  if(flowSel && cat[flowSel]){
    const o = cat[flowSel], N = Math.min(40, nD), s0 = nD-N;
    const ser = o.daily.slice(s0).map(val), dm = Math.max(1, ...ser.map(Math.abs));
    const cum = []; ser.reduce((a,v,i)=>(cum[i]=a+v), 0);
    const cols = ser.map((v,i) => { const di = s0+i, up = v>=0;
      return `<div class="col ${di===flowDay?'cur':''}" data-di="${di}" title="${F.days[di]}(週${wd(F.days[di])}):${f1(v)}">
        <i style="${up?`bottom:50%;`:`top:50%;`}height:${Math.abs(v)/dm*46}%;background:${up?UP:DN}"></i>
        ${i%5===0?`<em>${md(F.days[di])}</em>`:""}</div>`; }).join("");
    const list = o.codes.map(c => {
      const s = F.stocks[c], a = day ? s.d[flowDay] : s.w[flowWin];
      return {c, s, a, v:val(a)};
    }).sort((x,y)=>y.v-x.v);
    const label = day ? `${dayTitle}` : `近 ${flowWin} 日累計`;
    detail = `<h2 class="sec">${esc(flowSel)} · 族群指數與均線(成交值加權,基期 100)</h2>
      <div id="gidx" class="gidx"></div><div class="note" id="gidxNote"></div>
      <h2 class="sec">${esc(flowSel)} · ${WHO[flowWho]} · 每日淨流入(近 ${N} 日)</h2>
      <div class="fl-daily big">${cols}</div>
      <div class="note">紅柱=當日淨流入、綠柱=淨流出(億元)。點任一柱可切換到該日。近 ${N} 日合計 <b class="${cls(cum.at(-1))}">${f1(cum.at(-1))}</b>;
        流入 ${ser.filter(v=>v>0).length} 天、流出 ${ser.filter(v=>v<0).length} 天。</div>
      <h2 class="sec">成分股明細 · ${label}</h2>
      <table><thead><tr><th>個股</th><th class="n">收盤</th><th class="n">20日漲幅</th><th class="n">外資(億)</th><th class="n">投信(億)</th><th class="n">自營(億)</th><th class="n">合計(億)</th></tr></thead><tbody>
      ${list.map(x=>`<tr class="clk" data-c="${x.c}"><td><b>${esc(x.s.n)}</b> <span class="mute">${x.c}</span></td><td class="n">${fmt(x.s.c)}</td>
        <td class="n ${cls(x.s.r)}">${x.s.r==null?"—":pct(x.s.r)}</td>
        <td class="n ${cls(x.a[0])}">${fmt(x.a[0],1)}</td><td class="n ${cls(x.a[1])}">${fmt(x.a[1],1)}</td><td class="n ${cls(x.a[2])}">${fmt(x.a[2],1)}</td>
        <td class="n ${cls(x.a[0]+x.a[1]+x.a[2])}"><b>${fmt(x.a[0]+x.a[1]+x.a[2],1)}</b></td></tr>`).join("")}</tbody></table>
      <div class="note">點任一檔個股可查看 K 線。</div>`;
  }
  const nav = day ? `<span class="lab">日期</span><div class="seg" data-id="nav"><button data-k="prev">◀</button>
      <button class="on" style="min-width:128px;cursor:default">${dayTitle}</button><button data-k="next">▶</button></div>
      <select id="flowDaySel">${F.days.map((d,i)=>`<option value="${i}" ${i===flowDay?'selected':''}>${d}</option>`).reverse().join("")}</select>`
    : `<span class="lab">期間</span>${seg("win", F.windows.map(n=>[n, n+" 日"]), flowWin)}`;
  el.innerHTML = `
    <div class="fl-ctl">
      <span class="lab">檢視</span>${seg("mode", [["day","單日"],["cum","期間累計"]], flowMode)}
      ${nav}
      <span class="lab">分類</span>${seg("cat", [["theme","主題族群"],["industry","官方產業別"]], flowCat)}
      <span class="lab">法人</span>${seg("who", Object.entries(WHO), flowWho)}
      <span class="lab">排序</span>${seg("sort", [["v","法人買賣超"],["share","成交占比"],["ds","占比增減"],["ret","漲跌幅"],["bias","距月線"]], flowSort)}
    </div>
    <div class="fl-top"><div class="card"><div class="k">${day?dayTitle:`近 ${flowWin} 日`} · 資金流入前三</div><div class="up" style="margin-top:4px">${chips(top,"up")}</div></div>
      <div class="card"><div class="k">${day?dayTitle:`近 ${flowWin} 日`} · 資金流出前三</div><div class="dn" style="margin-top:4px">${chips(bot,"dn")}</div></div></div>
    <div class="note" style="margin:0 0 6px">${day?dayTitle:`近 ${flowWin} 日`}:各族群流入合計 <b class="up">${f1(inflow)}</b>,流出合計 <b class="dn">${f1(outflow)}</b>(族群有重疊,僅供參考)</div>
    <div class="fl-chart">${bars}</div>
    <h2 class="sec">每日資金熱度圖(近 ${HD} 日,億元)</h2>
    ${heat}
    <div class="note">每格=該族群當日${WHO[flowWho]}淨買賣超(紅買超、綠賣超,顏色越深金額越大;大格內顯示數字,其餘滑鼠移上去看)。點欄位日期切換日期、點族群列選擇族群。</div>
    ${ranking}
    ${detail}
    <div class="note">資金流向(長條)= 三大法人(外資+投信+自營商)淨買賣超張數 × 當日收盤價(估算,億元),不含散戶與融資券。成交占比 = 族群成交值 ÷ 全市場上市櫃一般股成交值;占比增減 = 與前 5 日(單日檢視)或前一段同長度期間(累計檢視)的差,單位為百分點;漲跌 = 成交值加權、未還原權息。訊號僅為輔助:法人買超 + 股價上漲 + 占比未縮 = 量價籌碼齊揚。主題族群為自訂分類(data/groups.json 可編輯),同一檔可屬多個族群,因此族群間金額不可相加。資料至 ${F.last}。</div>`;
  drawGidx();
}
let gidxChart = null;
function drawGidx(){
  if(gidxChart){ try{ gidxChart.remove(); }catch(e){} gidxChart = null; }
  const box = $("#gidx"), GI = window.GINDEX; if(!box) return;
  const x = GI && GI[flowCat] && GI[flowCat][flowSel];
  if(!x){ box.textContent = "尚無族群指數資料(請執行 update_all.bat)"; return; }
  const dts = GI.dates, ch = LightweightCharts.createChart(box, Object.assign(chartOpts(), {width:box.clientWidth, height:260}));
  gidxChart = ch;
  const sma_ = n => dts.map((d,i) => { if(i<n-1) return {time:d}; let a=0; for(let k=i-n+1;k<=i;k++) a+=x[k]; return {time:d, value:+(a/n).toFixed(2)}; });
  const idx = ch.addLineSeries({color:"#e5e7eb", lineWidth:2, title:"指數", priceLineVisible:false});
  idx.setData(dts.map((d,i)=>({time:d, value:x[i]})));
  ch.addLineSeries({color:"#c084fc", lineWidth:1, title:"MA20", priceLineVisible:false, lastValueVisible:false}).setData(sma_(20));
  ch.addLineSeries({color:"#2dd4bf", lineWidth:1, title:"MA60", priceLineVisible:false, lastValueVisible:false}).setData(sma_(60));
  const n = dts.length; ch.timeScale().setVisibleLogicalRange({from:Math.max(0,n-130), to:n+3});
  const e = window.FLOW.days[flowMode==="day" ? flowDay : window.FLOW.days.length-1], gi = dts.indexOf(e);
  if(gi>=0) idx.setMarkers([{time:e, position:"aboveBar", color:"#f5b942", shape:"arrowDown", text:e.slice(5)}]);
  if(gi>=59){
    const m20 = sma_(20)[gi].value, m60 = sma_(60)[gi].value, v = x[gi], r20 = gi>=20 ? (v/x[gi-20]-1)*100 : null;
    const st = (b) => b>=0 ? `<b class="up">站上</b>` : `<b class="dn">跌破</b>`;
    $("#gidxNote").innerHTML = `${e}:指數 <b>${v.toFixed(1)}</b>,月線(MA20)${m20.toFixed(1)} ${st(v-m20)} ${pct((v/m20-1)*100)},季線(MA60)${m60.toFixed(1)} ${st(v-m60)} ${pct((v/m60-1)*100)}`
      + (r20==null?"":`,近 20 日 <b class="${cls(r20)}">${pct(r20)}</b>`) + `。均線多頭(MA20 > MA60)${m20>m60?"成立":"未成立"}。`;
  }
}
$("#flow").addEventListener("click", e => {
  const sg = e.target.closest(".seg button");
  if(sg){ const id = sg.parentNode.dataset.id, k = sg.dataset.k;
    if(id==="cat"){ flowCat = k; flowSel = null; } else if(id==="win") flowWin = +k; else if(id==="who") flowWho = k;
    else if(id==="mode") flowMode = k;
    else if(id==="topn") flowTop = +k;
    else if(id==="sort") flowSort = k;
    else if(id==="nav"){ const n = window.FLOW.days.length; flowDay = Math.max(0, Math.min(n-1, (flowDay==null?n-1:flowDay) + (k==="prev"?-1:1))); }
    renderFlow(); return; }
  const di = e.target.closest("[data-di]");
  if(di){ flowDay = +di.dataset.di; flowMode = "day";
    const tr = e.target.closest("tr[data-g]"); if(tr) flowSel = tr.dataset.g;
    renderFlow(); return; }
  const r = e.target.closest(".fl-row, .fl-heat tr[data-g]"); if(r){ flowSel = r.dataset.g; renderFlow(); return; }
  const tr = e.target.closest("tr.clk"); if(tr) gotoStock(tr.dataset.c);
});
$("#flow").addEventListener("change", e => { if(e.target.id==="flowDaySel"){ flowDay = +e.target.value; renderFlow(); } });

renderSummary(); renderTables(); renderCalendar(); renderDigest(); renderList(); renderInfo(); renderFlow(); renderUS();
function setFS(v){
  FS = v; document.documentElement.style.setProperty("--fs", FS);
  try { localStorage.setItem("stock_fs", String(FS)); } catch(e) {}
  const fo = {layout:{fontSize:Math.round(12*FS)}};
  if(mainChart){ mainChart.applyOptions(fo); indChart.applyOptions(fo); }
  if(document.querySelector("#t-flow.on")) renderFlow();
  resizeCharts();
}
$("#fsUp").addEventListener("click", () => { const n = FS_STEPS.find(x => x > FS + 0.01); if(n) setFS(n); });
$("#fsDown").addEventListener("click", () => { const n = [...FS_STEPS].reverse().find(x => x < FS - 0.01); if(n) setFS(n); });
// 網址帶 #flow / #view / #tables / #calendar 時直接開啟該分頁(每日更新完成後會開啟 #flow)
{ const hb = document.querySelector(`#nav button[data-t="${location.hash.slice(1)}"]`); if(hb) hb.click(); }
window.addEventListener("resize", resizeCharts);
})();
</script>
</body>
