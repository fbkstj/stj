<!DOCTYPE html>
<!-- 由 重補修/基本電學重補修/自學系統/build_web.py 從 Index.html 產生，不要直接修改 -->
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基本電學｜重補修自學</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f2f5f5; --surface:#ffffff; --sunk:#e8eeee; --ink:#132228; --muted:#586a70; --line:#d5dfe0;
  --accent:#00787b; --accent-ink:#ffffff; --soft:#dff0ef;
  --ok:#1d7a45; --ok-soft:#e0f2e7; --warn:#9a6212; --warn-soft:#fbefd9; --bad:#b33a2e; --bad-soft:#f9e3e0;
  --shadow:0 1px 2px rgba(19,34,40,.06),0 6px 20px rgba(19,34,40,.06);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d161a; --surface:#142127; --sunk:#0f1b20; --ink:#e4edef; --muted:#90a3a8; --line:#24363d;
    --accent:#35b8b4; --accent-ink:#06201f; --soft:#12302f;
    --ok:#5cc88a; --ok-soft:#133022; --warn:#e3a64b; --warn-soft:#33260f; --bad:#ef8174; --bad-soft:#3a1a16;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 頂部 */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.chip-ic{flex:none;width:34px;height:34px;border-radius:6px;background:var(--ink);position:relative}
.chip-ic::before,.chip-ic::after{content:"";position:absolute;left:-4px;right:-4px;height:0;border-top:3px dotted var(--muted)}
.chip-ic::before{top:9px}.chip-ic::after{bottom:9px}
.chip-ic i{position:absolute;inset:9px;border-radius:50%;background:var(--accent)}
.brand-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user{display:flex;align-items:center;gap:10px;font-size:.9rem;flex:none}
.user .who{color:var(--muted)}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:500;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}

/* 登入 */
.login{max-width:400px;margin:48px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 24px;display:grid;gap:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:9px;padding:3px}
.tabs button{border:0;background:none;padding:7px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:grid;gap:6px}
.field label{font-size:.85rem;font-weight:500}
.field input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-family:var(--mono);letter-spacing:.06em}
.err{color:var(--bad);font-size:.88rem;min-height:1.4em}

/* 學生首頁 */
.hello{padding-block:28px 18px;display:grid;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stat{padding:14px 18px;display:grid;gap:2px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--mono);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat b small{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:3px}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:32px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* 關卡：以電路走線串起的焊點 */
.trace{list-style:none;margin:0;padding:0;position:relative}
.trace::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:3px;background:var(--line);border-radius:2px}
.trace li{position:relative;padding-left:60px;padding-bottom:12px}
.pad{position:absolute;left:6px;top:14px;width:33px;height:33px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font:700 .85rem var(--mono);color:var(--muted)}
.trace li.passed .pad{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trace li.active .pad{border-color:var(--accent);color:var(--accent)}
.lvcard{width:100%;text-align:left;display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.lvcard:hover:not(:disabled){border-color:var(--accent)}
.lvcard:disabled{cursor:default;background:transparent;border-style:dashed}
.lvtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lvtop h3{font-size:1.02rem}
.lvcard p{font-size:.9rem;color:var(--muted)}
.lvmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}

.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}

/* 關卡頁 */
.lvhead{padding-block:18px 16px;display:grid;gap:6px}
.player{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:12px;overflow:hidden}
.player iframe,.player video,.player>#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.player:fullscreen{border-radius:0}
/* 自製影片控制列：時間軸只能在看過的範圍內拖曳 */
.vbar{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:6px;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.vbar button,.vbig{background:none;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.vbar button{min-width:40px;height:40px;padding:0 6px;font:700 .8rem var(--sans);white-space:nowrap}
.vbar button:hover{background:rgba(255,255,255,.16)}
.vbar svg,.vbig svg{width:22px;height:22px;fill:currentColor}
.vtime{font:500 .8rem var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.vtrack{flex:1;min-width:40px;height:28px;position:relative;cursor:pointer;touch-action:none;display:flex;align-items:center}
.vtrack:focus-visible{outline:2px solid #35b8b4;outline-offset:2px;border-radius:4px}
.vtrack .rail{position:relative;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.vtrack:hover .rail,.vtrack.drag .rail{height:8px}
.vtrack i{position:absolute;top:0;bottom:0;left:0;width:0}
.vtrack .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(53,184,180,.55);pointer-events:none;left:0}
.vtrack .seen{background:rgba(255,255,255,.4)}
.vtrack .cur{background:#35b8b4}
.vbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.55)}
.vbig svg{width:34px;height:34px}
@media (max-width:480px){.vtime{font-size:.72rem}.vbar button{min-width:36px;height:36px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:.84rem;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.live.on{color:var(--ok)}
.live.on::before{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

/* 測驗 */
/* 術科 */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;margin-bottom:10px}
.pcard.done{border-color:var(--ok)}
.pcard h3{font-size:1rem}
.pcard .req{font-size:.92rem}
.pcard .rubric{font-size:.86rem;color:var(--muted);white-space:pre-line}
.fixbox{margin-top:14px;padding:16px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.fixbox h3{margin:0 0 6px;font-size:1.05rem}
.fixbox .pill{margin-left:6px}
.shot{display:block;max-width:min(320px,100%);border-radius:10px;border:1px solid var(--line);margin:10px 0}
.fixbox .row{gap:10px;align-items:center;flex-wrap:wrap}
.fixbox input[type=file]{font:inherit;max-width:100%}
.solve .ans{display:block;margin:6px 0 0;font-weight:700;color:var(--ok, #1d7a45)}
.solve{margin:8px 0 2px;padding:10px 12px;border-radius:8px;background:var(--soft);border-left:3px solid var(--accent);font-size:.9rem}
.solve b{display:block;margin-bottom:4px;color:var(--accent)}
.solve pre{margin:0;white-space:pre-wrap;font:13px/1.7 var(--sans);color:var(--ink)}
img.qfig{display:block;max-width:min(360px,100%);height:auto;margin:6px 0 10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
pre.sol{background:#10201f;color:#dbe7e4;border-radius:10px;padding:12px;margin:0 0 10px;overflow-x:auto;font:12.5px/1.55 Consolas,monospace;white-space:pre}
.pcard .field{gap:6px}
.pcard input[type=url],.pcard input[type=text],.pcard input[type=number],.pcard textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);font-family:inherit}
.pcard .link{word-break:break-all}
.locked{background:var(--sunk);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}
/* 術科動畫模擬圖 */.psim{width:150px;height:96px;display:block;color:var(--muted)}.psim text{font-family:var(--sans)}.ps-led{animation:ps-breath 3s ease-in-out infinite alternate}.ps-glow{animation:ps-glow 3s ease-in-out infinite alternate}.ps-slide{animation:ps-slide 3s ease-in-out infinite alternate}@keyframes ps-breath{from{opacity:.12}to{opacity:1}}@keyframes ps-glow{from{opacity:0;transform:scale(.7);transform-origin:46px 48px}to{opacity:.28;transform:scale(1);transform-origin:46px 48px}}@keyframes ps-slide{from{transform:translateX(0)}to{transform:translateX(35px)}}.ps-red{animation:ps-red 12s steps(1,end) infinite;opacity:.16}.ps-grn{animation:ps-grn 12s steps(1,end) infinite;opacity:.16}.ps-yel{animation:ps-yel 12s steps(1,end) infinite;opacity:.16}@keyframes ps-red{0%{opacity:1}41.67%{opacity:.16}100%{opacity:.16}}@keyframes ps-grn{0%{opacity:.16}41.67%{opacity:1}83.34%{opacity:.16}100%{opacity:.16}}@keyframes ps-yel{0%{opacity:.16}83.34%{opacity:1}100%{opacity:.16}}.ps-run{animation:ps-run 2.6s ease-in-out infinite alternate}@keyframes ps-run{from{transform:translateX(0)}to{transform:translateX(129px)}}.ps-p2>*{opacity:0;animation:ps-p2-seq 7s steps(1,end) infinite}@keyframes ps-p2-seq{0%{opacity:1}14.2857%{opacity:0}100%{opacity:0}}.ps-p2>*:nth-child(1){animation-delay:0.0s}.ps-p2>*:nth-child(2){animation-delay:1.0s}.ps-p2>*:nth-child(3){animation-delay:2.0s}.ps-p2>*:nth-child(4){animation-delay:3.0s}.ps-p2>*:nth-child(5){animation-delay:4.0s}.ps-p2>*:nth-child(6){animation-delay:5.0s}.ps-p2>*:nth-child(7){animation-delay:6.0s}.ps-p3>*{opacity:0;animation:ps-p3-seq 12s steps(1,end) infinite}@keyframes ps-p3-seq{0%{opacity:1}8.3333%{opacity:0}100%{opacity:0}}.ps-p3>*:nth-child(1){animation-delay:0.0s}.ps-p3>*:nth-child(2){animation-delay:1.0s}.ps-p3>*:nth-child(3){animation-delay:2.0s}.ps-p3>*:nth-child(4){animation-delay:3.0s}.ps-p3>*:nth-child(5){animation-delay:4.0s}.ps-p3>*:nth-child(6){animation-delay:5.0s}.ps-p3>*:nth-child(7){animation-delay:6.0s}.ps-p3>*:nth-child(8){animation-delay:7.0s}.ps-p3>*:nth-child(9){animation-delay:8.0s}.ps-p3>*:nth-child(10){animation-delay:9.0s}.ps-p3>*:nth-child(11){animation-delay:10.0s}.ps-p3>*:nth-child(12){animation-delay:11.0s}@media (prefers-reduced-motion:reduce){#pracBox:not(.ps-play) .psim *{animation:none!important}#pracBox:not(.ps-play) .ps-p2>*:not(:first-child),#pracBox:not(.ps-play) .ps-p3>*:not(:first-child){display:none}#pracBox:not(.ps-play) .ps-p2>*:first-child,#pracBox:not(.ps-play) .ps-p3>*:first-child{opacity:1}#pracBox:not(.ps-play) .ps-led,#pracBox:not(.ps-play) .ps-red{opacity:1}#pracBox:not(.ps-play) .ps-grn,#pracBox:not(.ps-play) .ps-yel{opacity:.16}#pracBox:not(.ps-play) .ps-glow{opacity:.25}}.pcard{grid-template-columns:1fr auto}.pcard>.psimbox{grid-row:1 / span 4;grid-column:2;align-self:start;padding-left:6px}@media (max-width:560px){.pcard{grid-template-columns:1fr}.pcard>.psimbox{grid-row:auto;grid-column:1;justify-self:center;padding:0}}
.demo-box-btn{width:150px;min-height:auto;margin-top:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 10px;background:var(--soft);border:2px dashed var(--accent);border-radius:12px;color:var(--accent);text-decoration:none;transition:all .2s;text-align:center;box-sizing:border-box}
.demo-box-btn:hover{background:var(--accent);color:#fff;border-style:solid;transform:scale(1.02);box-shadow:0 6px 16px rgba(0,105,107,.2)}
.demo-box-icon{font-size:1.6rem;line-height:1}
.demo-box-text{font-size:.9rem;font-weight:700;line-height:1.3}
.demo-box-sub{font-size:.74rem;opacity:.85;font-weight:500}
.q{border:0;margin:0;padding:14px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.q:first-child{border-top:0}
.q legend{padding:0;font-weight:500;display:flex;gap:10px}
.q legend .mono{color:var(--muted);flex:none}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{background:var(--sunk)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.q.right legend::after{content:"答對";margin-left:auto;color:var(--ok);font-size:.82rem}
.q.wrong legend::after{content:"答錯";margin-left:auto;color:var(--bad);font-size:.82rem}
.score{font:700 2.6rem/1 var(--mono);font-variant-numeric:tabular-nums}

/* 教師後台 */
.tbar{padding-block:24px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:500;background:var(--sunk)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr.st{cursor:pointer}
tbody tr.st:hover{background:var(--sunk)}
tr.detail td{background:var(--bg);white-space:normal}
.sess{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;font-size:.84rem}
.name b{display:block}
.name small{color:var(--muted);font-family:var(--mono)}
.note{margin-top:14px;font-size:.84rem;color:var(--muted)}

.loading{padding:60px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.9rem;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;background:rgba(10,20,24,.55);display:grid;place-items:center;z-index:30;padding:16px}
.overlay .box{background:var(--surface);border-radius:14px;padding:24px;max-width:340px;display:grid;gap:14px;text-align:center}

@media (max-width:620px){
  h1{font-size:1.35rem}
  .stats{grid-template-columns:1fr}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .user .who{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand">
      <span class="chip-ic" aria-hidden="true"><i></i></span>
      <div style="min-width:0">
        <div class="eyebrow" id="hdrSub">重補修自學</div>
        <div class="brand-title" id="hdrTitle">基本電學</div>
      </div>
    </div>
    <div class="user" id="hdrUser"></div>
  </div>
</header>
<main class="wrap" id="app"><div class="loading">載入中…</div></main>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="idle" hidden>
  <div class="box">
    <h2>還在學習嗎？</h2>
    <p class="muted">一段時間沒有操作，學習時間暫停計算。</p>
    <button class="btn" id="idleBtn">繼續學習</button>
  </div>
</div>

<script>window.RP_API_URL = 'https://script.google.com/macros/s/AKfycbzR5eGS8hLEKJoYn18rozcr9D-AcqOqKr5j7OZrbDZlKFslJGPWBb1MR-9Yy5RIZBsEQw/exec';window.RP_INFO = {"school": "楊梅高中", "year": 115, "subject": "基本電學", "teacher": "簡樹桐", "periods": 9};</script>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let TOKEN = null, ROLE = null, INFO = {};

// 在 Apps Script 網頁裡用 google.script.run；放在其他網站（例如 GitHub Pages）時，由頁面設定 window.RP_API_URL，改用 fetch 呼叫 doPost
const API_URL = window.RP_API_URL || '';
function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    const fail = e => {
      let msg = String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
      if (msg.indexOf('AUTH:') >= 0) { msg = msg.split('AUTH:')[1]; signOut(false); showLogin(msg); }
      reject(new Error(msg));
    };
    if (!API_URL) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(fail)[fn](...args);
      return;
    }
    // text/plain 是「簡單請求」，不會觸發 CORS 預檢；credentials: 'omit' 不帶 Google 登入 cookie
    const send = () => fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', keepalive: fn === 'heartbeat' || fn === 'logout' })
      .then(r => { if (!r.ok) throw new Error('連線失敗（' + r.status + '），請稍後再試'); return r.json(); });
    // Google 偶爾會回傳錯誤頁（不是程式的錯），只讀資料的呼叫自動重試一次，交卷、計時這種會寫入的不重試
    const readOnly = ['bootstrap', 'getHome', 'getLevel', 'getQuiz', 'getDashboard', 'getPracticals', 'getSolutions'].indexOf(fn) >= 0;
    send()
      .catch(e => (readOnly ? new Promise(r => setTimeout(r, 600)).then(send) : Promise.reject(e)))
      .then(d => (d.ok ? resolve(d.result) : fail(d.error)))
      .catch(e => fail(e && e.name === 'TypeError' ? '網路連線失敗，請檢查網路後再試' : e));
  });
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200);

function store(v) { try { v ? sessionStorage.setItem('rp', JSON.stringify(v)) : sessionStorage.removeItem('rp'); } catch (e) {} }
function restore() { try { return JSON.parse(sessionStorage.getItem('rp') || 'null'); } catch (e) { return null; } }

/* ───── 訂正上傳（測驗 3 次沒全對時） ───── */
function renderFix(p) {
  const box = $('#fixBox');
  if (!box) return;
  const f = p.fix;
  if (!p.needFix && !(f && f.status)) { box.innerHTML = ''; return; }
  const back = f && f.status === '需補做';
  if (p.passed && f && f.status && !back) {
    box.innerHTML = `<div class="fixbox"><h3>訂正已收到 ✓</h3>
      <p class="hint">${esc(f.time)} 上傳，下一關已經開了。老師之後會看你的訂正${f.comment ? '：' + esc(f.comment) : '，有問題會再告訴你'}。</p></div>`;
    return;
  }
  box.innerHTML = `<div class="fixbox">
    <h3>訂正上傳${back ? '<span class="pill bad">老師請你補做</span>' : ''}</h3>
    <p class="hint">測驗 3 次都沒有全對。請把<b>答錯的題目</b>抄在紙上訂正：題目、算式、答案都要寫，
      然後拍一張清楚的照片上傳。<b>上傳完就可以直接進下一關</b>，老師之後會看。</p>
    ${back && f.comment ? `<p class="hint">老師的意見：${esc(f.comment)}　請重新訂正後再上傳一次。</p>` : ''}
    <div class="field"><label for="fixFile">選擇照片（手機可直接拍照）</label>
      <input id="fixFile" type="file" accept="image/*" capture="environment"></div>
    <img class="shot" id="fixPrev" alt="" hidden>
    <div class="row"><span class="err" id="fixErr"></span>
      <button class="btn" id="fixBtn" type="button" disabled>上傳訂正</button></div>
  </div>`;

  let dataUrl = '';
  const prev = $('#fixPrev'), btn = $('#fixBtn'), err = $('#fixErr');
  $('#fixFile').onchange = ev => {
    const file = ev.target.files && ev.target.files[0];
    err.textContent = ''; btn.disabled = true; prev.hidden = true;
    if (!file) return;
    shrinkImage(file).then(url => {
      dataUrl = url; prev.src = url; prev.hidden = false; btn.disabled = false;
    }).catch(e => { err.textContent = '讀不到這張照片，請換一張'; });
  };
  btn.onclick = async () => {
    if (!dataUrl) return;
    btn.disabled = true; err.textContent = '上傳中…';
    try {
      await api('submitCorrection', TOKEN, LEVEL.id, dataUrl);
      toast('已上傳，下一關開了');
      showHome();
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
  };
}

/** 照片縮到最長邊 1400 像素再轉 JPG，手機直拍的大照片才傳得上去 */
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => { img.src = reader.result; };
    img.onerror = reject;
    img.onload = () => {
      const max = 1400;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    reader.readAsDataURL(file);
  });
}

/* ───── 學生首頁 ───── */
function levelState(l) {
  const p = l.progress;
  if (!l.unlocked) return { cls: 'locked', pill: '<span class="pill">未解鎖</span>' };
  if (p.passed) return { cls: 'passed', pill: `<span class="pill ok">已通過 · ${p.best} 分</span>` };
  if (p.quizCount && p.attemptsLeft === 0) return { cls: 'active', pill: '<span class="pill bad">次數用完，請找老師</span>' };
  if (p.quizCount) return { cls: 'active', pill: `<span class="pill warn">未通過 · 最高 ${p.best} 分</span>` };
  if (p.videoDone) return { cls: 'active', pill: '<span class="pill info">可以測驗</span>' };
  if (p.watchedSec > 0) return { cls: 'active', pill: '<span class="pill info">觀看中</span>' };
  return { cls: 'active', pill: '<span class="pill info">開始這一關</span>' };
}

/* ───── 關卡頁：影片＋計時＋測驗 ───── */
const IDLE_MIN = 15;
const study = { level: null, sec: 0, watch: 0, playing: false, mode: '', lastAct: Date.now(), idleMs: IDLE_MIN * 60000, timer: null, beat: null, progress: null, busy: false };
['mousemove', 'keydown', 'touchstart', 'scroll', 'click', 'blur'].forEach(ev => window.addEventListener(ev, () => { study.lastAct = Date.now(); }, { passive: true }));

function counting() {
  return document.visibilityState === 'visible' && $('#idle').hidden;
}
function tick() {
  if (document.visibilityState !== 'visible') return updateLive();
  if (!study.playing && Date.now() - study.lastAct > study.idleMs) { $('#idle').hidden = false; return updateLive(); }
  if (study.mode === 'player') {
    // 有影片的關卡：只有影片播放中或正在作答才算學習時間
    if (study.playing || $('#quizForm')) study.sec++;
    trackPos();
  } else {
    study.sec++;
    if (study.mode === 'time') study.watch++;
  }
  showWatch();
  updateLive();
}
/** 觀看進度＝依序看到的最遠位置：每秒最多前進 1.5 秒，跳到還沒看過的地方會被拉回來 */
function playerTime() {
  const v = $('#player video');
  if (v) return v.currentTime;
  if (YTP && YTP.getCurrentTime) return YTP.getCurrentTime();
  return 0;
}
function trackPos() {
  const t = playerTime();
  if (t > study.pos + 3) return blockSeek();
  if (study.playing && t > study.pos) study.pos = Math.min(t, study.pos + 1.5);
}
function blockSeek() {
  const v = $('#player video');
  if (v) v.currentTime = study.pos;

}
function updateLive() {
  const el = $('#live'); if (!el) return;
  const on = counting() && (study.mode === 'time' || study.playing);
  el.classList.toggle('on', on);
  if (study.mode === 'none') {
    el.classList.toggle('on', counting());
    el.textContent = counting() ? '正在記錄學習時間' : '已暫停記錄';
    return;
  }
  if (study.mode === 'player' && !study.playing && $('#quizForm')) {
    el.classList.toggle('on', counting());
    el.textContent = counting() ? '正在記錄作答時間' : '已暫停記錄';
    return;
  }
  el.textContent = on ? '正在記錄觀看時間' : (counting() ? '影片暫停中，暫停計時' : '已暫停記錄');

async function flush() {
  const pos = study.mode === 'player' ? Math.floor(study.pos) : null;
  if (!study.level || study.busy || (!study.sec && !study.watch && pos === study.sentPos)) return;
  const payload = { level: study.level, sec: study.sec, watch: study.watch };
  if (pos !== null) { payload.pos = pos; study.sentPos = pos; }
  study.sec = 0; study.watch = 0; study.busy = true;
  try { renderProgress(await api('heartbeat', TOKEN, payload)); }
  catch (e) { study.sec += payload.sec; study.watch += payload.watch; }

}

  study.pos = Number(d.progress && d.progress.watchedSec) || 0; study.sentPos = Math.floor(study.pos); study.doneSent = false;
  if (!d.video) study.mode = 'none';
  else study.mode = $('#player iframe') ? 'time' : 'player'; // 雲端硬碟退回嵌入播放器時，只能以停留時間計算
  study.idleMs = Math.max(IDLE_MIN * 60000, (d.duration + 300) * 1000);

function stopStudy(send) {
  if (send) flush();

}
window.addEventListener('pagehide', () => flush());

let YTP = null;
function loadYT() {
  return new Promise(res => {
    if (window.YT && YT.Player) return res();
    window.onYouTubeIframeAPIReady = res;
    // 程式裡的網址不能出現連續兩個斜線：HtmlService 會把後面整段當成註解刪掉
    const s = document.createElement('script'); s.src = 'https:' + '/' + '/www.youtube.com/iframe_api'; document.head.appendChild(s);
  });
}
function mountVideo(v) {
  const box = $('#player');
  if (v.type === 'drive') {
    // 雲端硬碟不讓其他網頁直接讀影片檔，只能用它的嵌入播放器（時間軸擋不掉，只能以停留時間計算）
    mountDrive(box, v.id);
  } else if (v.type === 'youtube') {
    box.innerHTML = '<div id="yt"></div>';
    loadYT().then(() => {
      YTP = new YT.Player('yt', { videoId: v.id, playerVars: { rel: 0, playsinline: 1, start: resumeAt(LEVEL.duration) },
        events: {
          onStateChange: e => { study.playing = e.data === YT.PlayerState.PLAYING; updateLive(); },
          onPlaybackRateChange: () => { if (YTP.getPlaybackRate() > 1) { YTP.setPlaybackRate(1); toast('影片請用正常速度觀看'); } },
        } });
    });
  } else {
    const vid = playerVideo(v.url);
    // 網站上的副本讀不到時，退回雲端硬碟的原檔
    if (v.drive) vid.addEventListener('error', () => { if (document.body.contains(vid)) mountDrive(box, v.drive); }, { once: true });
    box.appendChild(vid);
    addControls(box, vid);
  }
}
function mountDrive(box, driveId) {
  const id = encodeURIComponent(driveId);
  study.mode = 'time'; study.playing = false;
  box.innerHTML = `<iframe src="https:${"/"}/drive.google.com/file/d/${id}/preview" allow="autoplay; fullscreen" allowfullscreen title="關卡影片"></iframe>`;
  const a = document.createElement('a');
  a.href = 'https:' + '/' + '/drive.google.com/file/d/' + id + '/view'; a.target = '_blank'; a.rel = 'noopener';
  a.className = 'link'; a.textContent = '影片無法播放？在新分頁開啟';
  box.after(a);

function playerVideo(src) {
  const vid = document.createElement('video');
  vid.controls = false; vid.playsInline = true; vid.preload = 'metadata';
  vid.disablePictureInPicture = true;
  vid.addEventListener('contextmenu', e => e.preventDefault()); // 右鍵選單有「顯示控制項」，會叫出可以拖曳的時間軸
  ['play', 'playing'].forEach(ev => vid.addEventListener(ev, () => { study.playing = true; updateLive(); }));
  ['pause', 'ended', 'waiting'].forEach(ev => vid.addEventListener(ev, () => { study.playing = false; updateLive(); }));

  return vid;

  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  vol: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a4.5 4.5 0 010 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  mute: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2"/></svg>',
  full: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
};
/** 自製控制列：播放／暫停、倒退 10 秒、靜音、全螢幕；時間軸可以拖曳，但只能在已經看過的範圍內 */
function addControls(box, vid) {
  const bar = document.createElement('div');
  bar.className = 'vbar';
  bar.innerHTML = `<button type="button" data-a="play"></button>
    <button type="button" data-a="back" aria-label="倒退 10 秒">−10 秒</button>
    <span class="vtime">0:00 / 0:00</span>
    <div class="vtrack" role="slider" tabindex="0" aria-label="播放位置（只能拉到已經看過的地方）" aria-valuemin="0">
      <div class="rail"><i class="seen"></i><i class="cur"></i></div><b class="knob"></b></div>
    <button type="button" data-a="mute"></button>
    <button type="button" data-a="full" aria-label="全螢幕">${IC.full}</button>`;
  const big = document.createElement('button');
  big.type = 'button'; big.className = 'vbig'; big.setAttribute('aria-label', '播放'); big.innerHTML = IC.play;
  box.append(big, bar);
  const btn = a => bar.querySelector(`[data-a="${a}"]`);
  const toggle = () => { if (vid.paused) vid.play().catch(() => {}); else vid.pause(); };
  btn('play').onclick = toggle; big.onclick = toggle; vid.addEventListener('click', toggle);
  btn('back').onclick = () => { vid.currentTime = Math.max(0, vid.currentTime - 10); };
  btn('mute').onclick = () => { vid.muted = !vid.muted; };
  btn('full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (box.requestFullscreen) box.requestFullscreen().catch(() => {});
    else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); // iPhone 只能讓影片本身全螢幕
  };
  // 時間軸：點或拖曳到看過的地方；超過看過的最遠處就停在那裡
  const track = bar.querySelector('.vtrack');
  let warned = false;
  const seekTo = (sec, fromUser) => {
    const d = vid.duration || 0;
    if (!d) return;
    const limit = Math.min(d, study.mode === 'player' ? study.pos : d);
    if (sec > limit + 0.5 && fromUser && !warned) { warned = true; toast('還沒看過的部分不能快轉，可以往回看'); }
    vid.currentTime = Math.max(0, Math.min(sec, limit));
    sync();
  };
  const secAt = ev => {
    const r = track.getBoundingClientRect();
    return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * (vid.duration || 0);
  };
  track.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    warned = false;
    track.setPointerCapture(ev.pointerId);
    track.classList.add('drag');
    seekTo(secAt(ev), true);
  });
  track.addEventListener('pointermove', ev => { if (track.classList.contains('drag')) seekTo(secAt(ev), true); });
  const endDrag = () => track.classList.remove('drag');
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  track.addEventListener('keydown', ev => {
    const step = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5, PageDown: -30, PageUp: 30 }[ev.key];
    if (ev.key === 'Home') { ev.preventDefault(); warned = false; return seekTo(0, true); }
    if (ev.key === 'End') { ev.preventDefault(); warned = false; return seekTo(Infinity, true); }
    if (step) { ev.preventDefault(); warned = false; seekTo((vid.currentTime || 0) + step, true); }
  });

  const sync = () => {
    const d = vid.duration || 0, t = vid.currentTime || 0;
    bar.querySelector('.vtime').textContent = `${mmss(t)} / ${mmss(d)}`;
    bar.querySelector('.cur').style.width = d ? Math.min(100, t / d * 100) + '%' : '0';
    bar.querySelector('.knob').style.left = d ? Math.min(100, t / d * 100) + '%' : '0';
    track.setAttribute('aria-valuemax', String(Math.round(d)));
    track.setAttribute('aria-valuenow', String(Math.round(t)));
    track.setAttribute('aria-valuetext', `${mmss(t)}，已看到 ${mmss(Math.min(d, study.pos))}`);
    bar.querySelector('.seen').style.width = d ? Math.min(100, study.pos / d * 100) + '%' : '0';
    btn('play').innerHTML = vid.paused ? IC.play : IC.pause;
    btn('play').setAttribute('aria-label', vid.paused ? '播放' : '暫停');
    btn('mute').innerHTML = vid.muted ? IC.mute : IC.vol;
    btn('mute').setAttribute('aria-label', vid.muted ? '取消靜音' : '靜音');
    big.hidden = !vid.paused;
  };
  ['timeupdate', 'play', 'pause', 'ended', 'loadedmetadata', 'volumechange', 'seeked'].forEach(ev => vid.addEventListener(ev, sync));
  sync();
}
/** 從上次看到的地方繼續（剛開始或快看完時從頭播） */
function resumeAt(duration) {
  const p = Math.floor(Number(LEVEL && LEVEL.progress && LEVEL.progress.watchedSec) || 0);
  return p > 5 && p < (Number(duration) || 0) - 5 ? p : 0;
}

let LEVEL = null;

    <header class="lvhead"><div class="eyebrow">關卡 ${esc(d.id)}</div><h1>${esc(d.title)}</h1>${d.desc ? `<p class="muted">${esc(d.desc)}</p>` : ''}</header>
    ${d.video ? `<div class="player" id="player"></div>
    <div class="panel" id="watchPanel">
      <div class="row"><b>觀看進度</b><span class="mono" id="wtext"></span></div>

/** 觀看進度即時顯示：伺服器記錄加上還沒回報的部分 */
function showWatch() {
  const p = LEVEL && LEVEL.progress;
  if (!p || !$('#wtext')) return;
  let w = Number(p.watchedSec) || 0;
  if (study.level === LEVEL.id) w = study.mode === 'player' ? Math.max(w, Math.floor(study.pos)) : w + study.watch;
  const pct = p.needSec ? Math.min(100, w / p.needSec * 100) : 100;
  $('#wtext').textContent = `${mmss(Math.min(w, p.needSec))} / ${mmss(p.needSec)}`;
  $('#wbar').style.width = pct + '%';
  // 剛好看到門檻時立刻回報，測驗不用等下一次 30 秒回報才開放
  if (!p.videoDone && p.needSec && w >= p.needSec && !study.doneSent) { study.doneSent = true; flush(); }
}
function renderProgress(p) {
  if (!LEVEL) return;
  const wasDone = LEVEL.progress && LEVEL.progress.videoDone;
  LEVEL.progress = p;
  if ($('#wtext')) {
    showWatch();
    $('#whint').textContent = p.videoDone ? '已看完，可以作答'
      : ($('#player iframe') ? '停留在這個頁面觀看影片就會計時' : '依序看到 90% 就能作答，還沒看過的部分不能快轉');
  }
  if (!wasDone && p.videoDone && wasDone !== undefined) toast('影片看完了，測驗已解鎖');
  if (!$('#quizForm')) renderQuizBox();
  renderFix(p);
}

function renderQuizBox() {
  const p = LEVEL.progress, box = $('#quizBox');
  if (!box) return;
  const left = p.attemptsLeft == null ? '不限次數' : `剩 ${p.attemptsLeft} 次`;
  let html = `<div class="row"><h2>關卡測驗</h2><span class="hint">共 ${LEVEL.questionCount} 題 · ${left}</span></div>`;
  if (!LEVEL.questionCount) html += '<p class="muted">這一關老師還沒出題，請稍後再回來。</p>';
  else if (!p.videoDone) html += '<p class="muted">看完影片後就能作答。</p>';
  else if (p.passed) html += `<p>已通過，最高 <b class="mono">${p.best}</b> 分。</p><div class="row"><button class="btn" id="nextBtn">回關卡列表</button>${p.attemptsLeft !== 0 ? '<button class="btn ghost" id="quizBtn">再考一次</button>' : ''}</div>`;
  else if (p.attemptsLeft === 0) html += p.needFix
    ? `<p>最高 <b class="mono">${p.best}</b> 分，3 次都沒有全對。請依照下方說明訂正並拍照上傳，上傳完就能進下一關。</p>`
    : `<p>最高 <b class="mono">${p.best}</b> 分，作答次數已經用完，請找老師。</p>`;
  else html += `${p.quizCount ? `<p>目前最高 <b class="mono">${p.best}</b> 分，還沒通過。</p>` : ''}<div><button class="btn" id="quizBtn">開始測驗</button></div>`;
  box.innerHTML = html;
  if ($('#quizBtn')) $('#quizBtn').onclick = startQuiz;
  if ($('#nextBtn')) $('#nextBtn').onclick = () => showHome();
}

async function startQuiz() {
  const box = $('#quizBox');
  box.innerHTML = '<p class="muted">載入題目…</p>';
  let qs;
  try { qs = await api('getQuiz', TOKEN, LEVEL.id); } catch (e) { toast(e.message); return renderQuizBox(); }
  box.innerHTML = `<div class="row"><h2>關卡測驗</h2><span class="hint">每題單選</span></div>
    <form id="quizForm">${qs.map((q, i) => `
      <fieldset class="q" data-no="${esc(q.no)}"><legend><span class="mono">${i + 1}.</span><span>${esc(q.text)}</span></legend>
      ${q.img ? `<img class="qfig" src="${esc(q.img)}" alt="第 ${i + 1} 題電路圖" loading="lazy">` : ''}
        ${q.options.map(o => `<label class="opt"><input type="radio" name="q${esc(q.no)}" value="${o.key}"><span><b class="mono">${o.label || o.key}</b>　${esc(o.text)}</span></label>`).join('')}
      </fieldset>`).join('')}
      <div class="row" style="margin-top:12px"><span class="err" id="qerr"></span><button class="btn" type="submit" id="subBtn">交卷</button></div>
    </form>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('#quizForm').onsubmit = async ev => {
    ev.preventDefault();
    const answers = {}; let missing = 0;
    qs.forEach(q => { const c = box.querySelector(`input[name="q${CSS.escape(q.no)}"]:checked`); c ? answers[q.no] = c.value : missing++; });
    if (missing && !confirm(`還有 ${missing} 題沒作答，確定要交卷嗎？`)) return;
    $('#subBtn').disabled = true;
    try {
      const r = await api('submitQuiz', TOKEN, LEVEL.id, answers);
      r.results.forEach(x => {
        const f = box.querySelector(`fieldset[data-no="${CSS.escape(x.no)}"]`);
        if (!f) return;
        f.classList.add(x.correct ? 'right' : 'wrong');
        if (x.correct || (!x.steps && !x.orig)) return;
        const d = document.createElement('div');
        d.className = 'solve';
        const from = x.orig ? (x.varied ? `本題由原卷第 ${esc(x.orig)} 題改編（數字每次不同）` : `本題出自原卷第 ${esc(x.orig)} 題`) : '';
        d.innerHTML = (from ? `<b>${from}</b>` : '') + (x.steps ? `<pre>${esc(x.steps)}</pre>` : '')
          + (x.right ? `<span class="ans">正確答案：${esc(x.right)}</span>` : '');
        f.appendChild(d);
      });
      box.querySelectorAll('#quizForm input').forEach(i => { i.disabled = true; });
      LEVEL.progress = r.progress;
      const p = r.progress;
      const result = document.createElement('div');
      result.className = 'panel'; result.style.marginTop = '0';
      result.innerHTML = `<div class="row"><div><div class="eyebrow">這次得分</div><div class="score">${r.score}</div></div>
        <span class="pill ${p.passed ? 'ok' : 'warn'}">${p.passed ? '通過，下一關已解鎖' : '還沒通過'}</span></div>
        <div class="row"><button class="btn" id="homeBtn">回關卡列表</button>${!p.passed && p.attemptsLeft !== 0 ? `<button class="btn ghost" id="retryBtn">再考一次${p.attemptsLeft != null ? `（剩 ${p.attemptsLeft} 次）` : ''}</button>` : ''}</div>`;
      box.prepend(result);
      $('#subBtn').remove();
      $('#homeBtn').onclick = () => showHome();
      if ($('#retryBtn')) $('#retryBtn').onclick = startQuiz;
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) { $('#qerr').textContent = e.message; $('#subBtn').disabled = false; }
  };
}

/* ───── 教師後台 ───── */
function cellOf(l, pass) {
  if (l.passed) return `<span class="pill ok">通過 ${l.best}</span>`;
  if (l.quizCount) return `<span class="pill ${l.attemptsLeft === 0 ? 'bad' : 'warn'}">${l.best} 分 · ${l.quizCount} 次</span>`;
  if (l.videoDone) return '<span class="pill info">看完未測</span>';
  if (l.watchedSec > 0) return `<span class="pill">觀看 ${Math.min(99, Math.round(l.watchedSec / l.needSec * 100))}%</span>`;
  return '<span class="muted">—</span>';
}

  const wait = d.corrections.filter(c => c.status === '已上傳');
  const done = d.corrections.filter(c => c.status !== '已上傳');
  const card = (c, i) => `
    <section class="pcard${c.status === '老師已確認' ? ' done' : ''}" data-sid="${esc(c.sid)}" data-lv="${esc(c.level)}" data-file="${esc(c.fileId)}">
      <div class="row"><h3>${esc(c.name)}｜關卡 ${esc(c.level)} 訂正</h3>
        <span class="pill ${c.status === '老師已確認' ? 'ok' : (c.status === '需補做' ? 'bad' : 'warn')}">${esc(c.status)}</span></div>
      <p class="hint">上傳 ${esc(c.time)}　<button class="link showShot" type="button">看照片</button>
        <a class="link" href="${esc(c.link)}" target="_blank" rel="noopener">在雲端硬碟開啟 ↗</a></p>
      <div class="shotBox"></div>
      <div class="field"><label for="fc${i}">給學生的話（要補做時務必寫）</label>
        <input id="fc${i}" class="fcomment" type="text" value="${esc(c.comment || '')}" placeholder="例如：第 3 題的算式再寫清楚一點"></div>
      <div class="row"><span class="err"></span>
        <span style="display:flex;gap:8px"><button class="btn ghost sm fback" type="button">要補做</button>
          <button class="btn sm fpass" type="button">看過了，沒問題</button></span></div>
    </section>`;
  box.innerHTML = `
    <div class="section-title"><h2>訂正確認</h2>
      <span class="hint">還沒看過 ${wait.length} 件 · 學生測驗 3 次沒全對就要上傳訂正；上傳當下系統已放行，這裡是事後查看</span></div>
    ${wait.map(card).join('') + done.map((c, i) => card(c, wait.length + i)).join('')}`;
  box.querySelectorAll('.pcard').forEach(c => {
    c.querySelector('.showShot').onclick = async ev => {
      const btn = ev.currentTarget, holder = c.querySelector('.shotBox');
      if (holder.firstChild) { holder.innerHTML = ''; btn.textContent = '看照片'; return; }
      btn.disabled = true; btn.textContent = '載入中…';
      try {
        const url = await api('getCorrectionImage', TOKEN, c.dataset.file);
        holder.innerHTML = `<img class="shot" src="${url}" alt="訂正照片">`;
        btn.textContent = '收起照片';
      } catch (e) { holder.innerHTML = `<p class="hint">${esc(e.message)}</p>`; btn.textContent = '看照片'; }
      btn.disabled = false;
    };
    const send = async status => {
      const err = c.querySelector('.err'), btns = c.querySelectorAll('.fpass,.fback');
      err.textContent = ''; btns.forEach(b => { b.disabled = true; });
      try {
        await api('gradeCorrection', TOKEN, c.dataset.sid, c.dataset.lv, status, c.querySelector('.fcomment').value);
        toast(status === '老師已確認' ? '已標記看過' : '已標記需補做，學生在那一關會看到你的意見');
        showTeacher();
      } catch (e) { err.textContent = e.message; btns.forEach(b => { b.disabled = false; }); }
    };
    c.querySelector('.fpass').onclick = () => send('老師已確認');
    c.querySelector('.fback').onclick = () => send('需補做');
  });
}

/** 教師後台：術科評分 */
function renderPracGrade(d) {
  const box = $('#pracGrade');
  if (!box || !d.practicals.length) return;
  const rows = [];
  d.students.forEach(s => s.practicals.forEach(t => { if (t.status) rows.push({ s, t }); }));
  const wait = rows.filter(r => r.t.status === '待評分');
  const done = rows.filter(r => r.t.status !== '待評分');
  const card = (r, idx) => `
    <section class="pcard${r.t.status === '通過' ? ' done' : ''}" data-sid="${esc(r.s.sid)}" data-pid="${esc(r.t.id)}">
      <div class="row"><h3>${esc(r.s.name)}｜${esc(r.t.id)} ${esc(r.t.title)}</h3>
        <span class="pill ${r.t.status === '通過' ? 'ok' : (r.t.status === '退回' ? 'bad' : 'warn')}">${esc(r.t.status)}${r.t.status === '通過' && r.t.score != null ? ' ' + r.t.score : ''}</span></div>
      <p class="hint">繳交 ${esc(r.t.time)}　<a class="link" href="${esc(r.t.link)}" target="_blank" rel="noopener">開啟 Tinkercad 作品 ↗</a></p>
      <div class="row" style="gap:8px;align-items:flex-end">
        <div class="field" style="flex:0 0 110px"><label for="sc${idx}">分數（滿分 ${r.t.points}）</label>
          <input id="sc${idx}" class="pscore" type="number" min="0" max="${r.t.points}" step="1" value="${r.t.score != null ? r.t.score : ''}"></div>
        <div class="field" style="flex:1 1 220px"><label for="cm${idx}">評語</label>
          <input id="cm${idx}" class="pcomment" type="text" value="${esc(r.t.comment || '')}" placeholder="例如：遲滯做得好，記得加註解"></div>
      </div>
      <div class="row"><span class="err"></span>
        <span style="display:flex;gap:8px"><button class="btn ghost sm pback" type="button">退回重做</button><button class="btn sm ppass" type="button">通過並給分</button></span></div>
    </section>`;
  box.innerHTML = `
    <div class="section-title"><h2>術科評分</h2><span class="hint">待評分 ${wait.length} 件 · 術科占學期成績 ${Math.round(d.practicalWeight * 100)}%</span></div>
    ${rows.length ? wait.map(card).join('') + done.map((r, i) => card(r, wait.length + i)).join('')
      : '<div class="locked">還沒有人繳交術科。學生要 9 關全部通過才會開放繳交。</div>'}
    <details style="margin-top:10px"><summary>術科題目（共 ${d.practicals.length} 題，可在試算表「術科題目」分頁修改）</summary>
      ${d.practicals.map(t => `<p class="hint"><b>${esc(t.id)} ${esc(t.title)}</b>（${t.points} 分）：${esc(t.req)}</p>`).join('')}</details>
    <details id="solBox" style="margin-top:6px"><summary>參考程式（只有老師看得到）</summary>
      <div id="solBody"><p class="hint">展開後才會載入。</p></div></details>`;
  const solBox = $('#solBox');
  if (solBox) solBox.ontoggle = async () => {
    if (!solBox.open || solBox.dataset.loaded === '1') return;
    solBox.dataset.loaded = '1';
    const body = $('#solBody');
    body.innerHTML = '<p class="hint">載入中…</p>';
    try {
      const list = await api('getSolutions', TOKEN);
      body.innerHTML = list.map(x => `<p class="hint"><b>${esc(x.id)}｜${esc(x.title)}</b>　${esc(x.note || '')}</p><pre class="sol">${esc(x.code)}</pre>`).join('');
    } catch (e) { solBox.dataset.loaded = ''; body.innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  };
  box.querySelectorAll('.pcard').forEach(c => {
    const send = async status => {
      const err = c.querySelector('.err'), btns = c.querySelectorAll('button');
      err.textContent = ''; btns.forEach(b => { b.disabled = true; });
      try {
        await api('gradePractical', TOKEN, c.dataset.sid, c.dataset.pid,
          Number(c.querySelector('.pscore').value || 0), c.querySelector('.pcomment').value, status);
        toast(status === '通過' ? '已評分' : '已退回，學生可以重交');
        showTeacher();
      } catch (e) { err.textContent = e.message; btns.forEach(b => { b.disabled = false; }); }
    };
    c.querySelector('.ppass').onclick = () => send('通過');
    c.querySelector('.pback').onclick = () => send('退回');
  });
}

/* ───── 啟動 ───── */
(async function boot() {
  try {
    INFO = window.RP_INFO || await api('bootstrap');   // 網站版已把科目資訊寫進網頁，可以少打一次
    $('#hdrTitle').textContent = INFO.subject;
    $('#hdrSub').textContent = `${INFO.school} ${INFO.year} 學年度重補修自學`;
  } catch (e) { app.innerHTML = `<p class="loading">${esc(e.message)}</p>`; return; }
  const saved = restore();
  if (saved && saved.token) {
    TOKEN = saved.token; ROLE = saved.role;
    return ROLE === 'teacher' ? showTeacher() : showHome();
  }
  showLogin();
})();
</script>
