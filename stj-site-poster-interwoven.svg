<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description" lang="zh-Hant-TW" xml:lang="zh-Hant-TW">
  <title id="title">簡老師的個人網站｜教學資源與工具</title>
  <desc id="description">重疊交錯的示波器、Arduino Nano、AI 辨識框與競賽獎牌，由一條發光訊號連在一起。</desc>

  <style>
    .signal-pulse {
      opacity: 0;
      stroke-dasharray: 9 100;
      stroke-dashoffset: 9;
      animation: transmit 6.4s linear infinite;
    }

    .signal-branch { animation-delay: 2.5s; }

    @keyframes transmit {
      0%, 6% { opacity: 0; stroke-dashoffset: 9; }
      12%, 49% { opacity: 1; }
      59%, 100% { opacity: 0; stroke-dashoffset: -100; }
    }

    @media (prefers-reduced-motion: reduce) {
      .signal-pulse { display: none; animation: none; }
    }
  </style>

  <defs>
    <radialGradient id="background" cx="73%" cy="48%" r="76%">
      <stop stop-color="#1A3B50"/>
      <stop offset=".58" stop-color="#132A3F"/>
      <stop offset="1" stop-color="#101F30"/>
    </radialGradient>
    <linearGradient id="board" x2="1" y2="1">
      <stop stop-color="#225655"/>
      <stop offset="1" stop-color="#153E46"/>
    </linearGradient>
    <pattern id="blueprint" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#AAD3D9" stroke-opacity=".075"/>
    </pattern>
    <pattern id="screen-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#8EC4C8" stroke-opacity=".23"/>
    </pattern>
    <pattern id="pins" width="15" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7" r="3.2" fill="#B9DBCC"/>
      <circle cx="7.5" cy="7" r="1.4" fill="#17444B"/>
    </pattern>
    <path id="main-signal" pathLength="100" d="M491 414h40l17-17h22l14-22 16 42 21-55 22 35h92l69-69h48l62-62h39l36-36h48l33 33h64"/>
    <path id="award-signal" pathLength="100" d="M989 230v64l31 31v20"/>
  </defs>

  <rect width="1200" height="560" fill="url(#background)"/>
  <rect width="1200" height="560" fill="url(#blueprint)"/>
  <rect x="22" y="22" width="1156" height="516" fill="none" stroke="#52758A" stroke-opacity=".6"/>
  <path d="M22 43V22h21m1114 0h21v21M22 517v21h21m1114 0h21v-21" fill="none" stroke="#8AAFBF" stroke-width="2"/>

