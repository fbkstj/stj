  <!-- The same live trace crosses the objects and branches to the award. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <use href="#main-signal" stroke="#102B39" stroke-width="8" opacity=".82"/>
    <use href="#main-signal" stroke="#89E2D0" stroke-width="2.5"/>
    <use href="#award-signal" stroke="#EAC189" stroke-width="2"/>
    <g class="signal-pulse">
      <use href="#main-signal" stroke="#86F3DB" stroke-width="12" opacity=".32"/>
      <use href="#main-signal" stroke="#F0FFF7" stroke-width="4"/>
    </g>
    <g class="signal-pulse signal-branch">
      <use href="#award-signal" stroke="#FFD59E" stroke-width="9" opacity=".36"/>
      <use href="#award-signal" stroke="#FFF1D2" stroke-width="3"/>
    </g>
    <circle cx="989" cy="230" r="5" fill="#244453" stroke="#D5EEE1" stroke-width="2"/>
    <circle cx="1134" cy="263" r="4" fill="#244453" stroke="#89E2D0" stroke-width="2"/>
