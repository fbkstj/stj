    <rect width="297" height="143" rx="12" fill="#1C374A" stroke="#83B5BC" stroke-width="2"/>
    <rect x="15" y="28" width="200" height="98" rx="4" fill="#122B3C" stroke="#648F9D"/>
    <rect x="16" y="29" width="198" height="96" rx="3" fill="url(#screen-grid)"/>
