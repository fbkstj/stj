<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位乙級PCB佈局指引</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .step-number {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background-color: #3b82f6; color: white; border-radius: 50%; font-weight: bold; flex-shrink: 0;
            font-size: 1.1rem;
        }
        .resistor-node {
            background: #eff6ff; border: 2px solid #3b82f6; color: #1e40af;
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-weight: 800; font-size: 1.1rem;
        }
        /* 分頁按鈕樣式 */
        .tab-btn.active {
            background-color: #1e293b; color: white; border-color: #1e293b;
        }
        .sub-tab-btn.active {
            background-color: #334155; color: white;
        }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 antialiased p-2 md:p-6">

    <div class="max-w-6xl mx-auto">
        <!-- 返回首頁按鈕 -->
        <div class="mb-4">
            <a href="index.html" target="_top" class="text-slate-500 hover:text-slate-800 text-base font-bold inline-flex items-center gap-2 transition-colors">
                <i class="fas fa-arrow-left"></i> 返回首頁
            </a>
        </div>

        <!-- Header -->
        <header class="bg-slate-900 text-white py-8 px-6 rounded-3xl shadow-xl mb-6 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-2 tracking-tight">數位乙級PCB佈局指引</h1>
            <p class="text-slate-400 text-lg font-light">數位電子術科：CPLD 與驅動電路佈局手冊</p>
        </header>

        <!-- 題目切換分頁 -->
        <div class="flex justify-center mb-8 gap-2">
            <button onclick="switchQuestion('q1')" id="q1-tab" class="tab-btn active px-8 py-3 rounded-2xl font-bold shadow-md transition-all border-2 border-transparent">術科第 1 題</button>
            <button onclick="switchQuestion('q2')" id="q2-tab" class="tab-btn bg-white text-slate-500 px-8 py-3 rounded-2xl font-bold shadow-md transition-all border-2 border-slate-200 hover:border-slate-400">術科第 2 題</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Left Column: Image -->
            <div class="lg:col-span-7">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 sticky top-6">
                    <div class="mb-5 flex flex-col sm:flex-row items-center justify-between gap-4 px-2">
                        <span id="display-title" class="text-sm font-bold text-slate-500 uppercase tracking-widest italic font-mono">第 1 題：正面佈局</span>
                        
                        <!-- 正反面切換 -->
                        <div class="flex bg-slate-100 p-1 rounded-xl">
                            <button onclick="switchSide('front')" id="front-tab" class="sub-tab-btn active px-5 py-1.5 rounded-lg text-sm font-bold transition-all">正面</button>
                            <button onclick="switchSide('back')" id="back-tab" class="sub-tab-btn px-5 py-1.5 rounded-lg text-sm font-bold text-slate-500 transition-all">背面</button>
                        </div>
                    </div>

                    <!-- 圖片顯示區塊 -->
                    <div class="relative overflow-hidden rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center min-h-[400px] shadow-inner" id="img-box">
                        <img id="main-pcb-image" 
                             src="https://lh3.googleusercontent.com/d/1EYdxG-aYWfBQbe56aQXDCRRh3JYOik9r" 
                             alt="PCB Layout" 
                             class="max-w-full h-auto transition-opacity duration-300">
                    </div>

                    <div class="mt-8 grid grid-cols-2 gap-6">
                        <div class="p-4 bg-red-50 rounded-2xl border border-red-100">
                            <p class="text-sm text-red-800 font-bold mb-2 flex items-center">
                                <span class="w-3 h-3 bg-red-500 rounded-full mr-2"></span>紅色標註
                            </p>
                            <p class="text-sm text-red-600 leading-normal font-medium">定位基準與 Y 軸對齊線，決定電路板整體方位。</p>
                        </div>
                        <div class="p-4 bg-orange-50 rounded-2xl border border-orange-100">
                            <p class="text-sm text-orange-800 font-bold mb-2 flex items-center">
                                <span class="w-3 h-3 bg-orange-500 rounded-full mr-2"></span>橘色標註
                            </p>
                            <p class="text-sm text-orange-600 leading-normal font-medium">網格間距要求（3格/5格/9格），確保佈局美觀與散熱。</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Dynamic Info -->
            <div id="info-panel" class="lg:col-span-5 space-y-8 fade-in">
                <!-- 一、 定位基準 (Dynamic) -->
                <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                    <h2 class="font-bold mb-4 flex items-center text-slate-800 text-xl">
                        <i class="fas fa-location-dot text-red-500 mr-3"></i> 一、 核心定位基準
                    </h2>
                    <div id="desc-pos" class="text-base text-slate-600 leading-relaxed"></div>
                </section>

                <!-- 二、 口訣提示 (Dynamic) -->
                <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                    <h2 class="font-bold mb-5 flex items-center text-slate-800 text-xl">
                        <i class="fas fa-sort-numeric-down text-blue-500 mr-3"></i> 二、 限流電阻安裝順序
                    </h2>
                    <div id="resistor-container" class="flex flex-wrap justify-between gap-3 mb-4"></div>
                    <p class="text-sm text-slate-500 text-center italic bg-slate-50 py-2 rounded-lg font-medium">※ 順序：由上至下對應顯示器 A-G 段碼</p>
                </section>

                <!-- 三、 組裝作業程序 (Dynamic) -->
                <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                    <h2 class="font-bold mb-6 flex items-center text-slate-800 text-xl" id="step-title">
                        <i class="fas fa-route text-slate-500 mr-3"></i> 三、 反面佈線與走線程序
                    </h2>
                    <div id="steps-container" class="space-y-8 relative">
                        <div class="absolute left-[19px] top-2 bottom-2 w-0.5 bg-slate-100 -z-10"></div>
                        <!-- Steps will be injected here -->
                    </div>
                </section>

                <!-- 四、 裝配建議總結表 (Dynamic) -->
                <section id="table-section" class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 hidden">
                    <h2 class="font-bold mb-5 flex items-center text-slate-800 text-xl">
                        <i class="fas fa-table-list text-indigo-500 mr-3"></i> 四、 裝配間距建議總結表
                    </h2>
                    <div class="overflow-hidden rounded-xl border border-slate-200 shadow-sm">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200">
                                <tr>
                                    <th class="px-4 py-3 w-1/3">區段 / 項目</th>
                                    <th class="px-4 py-3 w-1/4">規格 / 格數</th>
                                    <th class="px-4 py-3">裝配關鍵說明</th>
                                </tr>
                            </thead>
                            <tbody id="summary-tbody" class="divide-y divide-slate-100 bg-white">
                                <!-- Table rows injected here -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 五、 品質控管點 (Dynamic) -->
                <section class="bg-amber-50 p-6 rounded-[2rem] border border-amber-200 shadow-sm">
                    <h2 class="font-bold mb-4 text-amber-900 text-base flex items-center">
                        <i class="fas fa-shield-halved mr-3"></i> <span id="qc-title">品質控管點</span>
                    </h2>
                    <ul id="qc-container" class="space-y-3"></ul>
                </section>
            </div>
        </div>
    </div>

    <footer class="bg-slate-100 py-10 mt-16 text-center text-slate-500 text-sm border-t border-slate-200">
        <p>© 2024 PCB 佈局導覽手冊 - 數位電子術科專用</p>
    </footer>

    <script>
        const config = {
            q1: {
                title: "第 1 題",
                front: "1EYdxG-aYWfBQbe56aQXDCRRh3JYOik9r",
                back: "1jxRXkz9K4etE1qt77FA7EEEE90GtDMyl",
                posDesc: `
                    <ul class="space-y-4 text-sm">
                        <li><strong class="text-slate-900 text-base">1. CPLD 3064 基準定位</strong><br>以圖中紅色箭頭指向之 CPLD 右下角引腳為基準。其底部距離電路板下邊界為 <span class="text-orange-600 font-bold">5格</span>。</li>
                        <li><strong class="text-slate-900 text-base">2. 核心顯示區間隔</strong><br>CPLD 右側引腳距離電阻 (R1~R7) 左側焊盤為 <span class="text-orange-600 font-bold">3格</span>。七段顯示器 (共陰極) 位於電阻右側，其下方與 CPLD 底部維持水平對齊。</li>
                        <li><strong class="text-slate-900 text-base">3. 電晶體掃描控制區</strong><br>四顆 CS9013 電晶體與七段顯示器上邊緣間隔 <span class="text-orange-600 font-bold">3格</span>，右側距離電路板邊緣預留 <span class="text-orange-600 font-bold">5格</span> 緩衝空間。</li>
                    </ul>
                `,
                mnemonic: [1, 6, 2, 7, 3, 5, 4],
                stepTitle: "反面佈線邏輯與程序",
                steps: [
                    { t: "垂直與水平匯流排", d: "<span class='font-bold text-slate-700'>5格區域：</span>反面圖兩側邊緣的垂直走線、以及 CPLD 下方的橫跨長線，均與邊界維持 5 格間距，確保焊點穩定與美觀。" },
                    { t: "段碼匯流轉折", d: "<span class='font-bold text-slate-700'>3格區域：</span>電阻與 CPLD 之間走線密集，間隔控制在 3 格內。建議 <strong class='text-red-600 font-bold'>優先焊接此區塊</strong>，避免後期空間不足。" },
                    { t: "掃描控制線", d: "從電晶體下方至七段顯示器控制端，預留了多處 <span class='font-bold text-slate-700'>3格</span> 的轉彎空間，有助於區分四個位數的掃描信號，防止短路。" }
                ],
                qcTitle: "品質控管點",
                qc: [
                    "限流電阻排列順序務必為 1627354，對應段碼 a-g，接錯會導致顯示亂碼。",
                    "CS9013 電晶體非常容易插反，請特別注意 E-B-C 腳位方向與半圓平面。"
                ],
                hasTable: true,
                tableData: [
                    { region: "CPLD 定位", grid: "<span class='text-orange-600 font-bold'>下 5 格</span>", desc: "這是全板起點，若錯位則上方電晶體會放不下。" },
                    { region: "電阻排列", grid: "<span class='text-blue-600 font-bold font-mono tracking-widest'>1627354</span>", desc: "段碼 a-g 的順序，接錯會導致顯示亂碼。" },
                    { region: "電晶體區", grid: "<span class='text-orange-600 font-bold'>距七段上緣 3 格</span>", desc: "注意 E-B-C 腳位方向，CS9013 很容易插反。" },
                    { region: "七段顯示器", grid: "<span class='text-slate-700 font-bold'>4位數 CC (共陰)</span>", desc: "定位在板子中間偏右，留出上方給電晶體、左方給電阻。" }
                ]
            },
            q2: {
                title: "第 2 題",
                front: "16GKq4G9OJJj3yKDbkFQ8JWCZvT_v7CUk", 
                back: "18xx6xycR1n0dAqMDJ9QNhtrgIGCNbg-l",
                posDesc: `
                    <ul class="space-y-4 text-sm">
                        <li><strong class="text-slate-900 text-base">1. 矩陣按鍵 (3x4 Keypad)</strong><br>R8-R10 上下焊接點距離 <span class="text-orange-600 font-bold">3格</span>。下方接三顆下拉電阻 (R8-R10) 垂直對齊引腳；右側距離 CPLD 預留 <span class="text-orange-600 font-bold">9格</span> 跨度。</li>
                        <li><strong class="text-slate-900 text-base">2. CPLD 3064 核心位置</strong><br>底部引腳距下方零件框 <span class="text-orange-600 font-bold">11格</span>。元件框內標註 <span class="text-orange-600 font-bold">1格</span> 預留作為過孔或微調參考。</li>
                        <li><strong class="text-slate-900 text-base">3. 七段顯示器與限流電阻</strong><br>CPLD 往右算 <span class="text-orange-600 font-bold">3格</span> 進入水平排列 R1-R7 限流電阻區。</li>
                    </ul>
                `,
                mnemonic: [7, 6, 1, 2, 3, 4, 5],
                stepTitle: "反面佈線與走線程序",
                steps: [
                    { t: "橫向匯流排 (Horizontal Bus)", d: "<span class='font-bold text-slate-700'>9格區域：</span>用於 Keypad 與 CPLD 間控制線，線距 1 格。<br><span class='font-bold text-slate-700'>12格區域：</span>Keypad 下方長距離水平走線，跨 12格 後向上轉折作掃描線。" },
                    { t: "縱向走線 (Vertical Tracks)", d: "CPLD 正下方有一組 <span class='font-bold text-slate-700'>11格</span> 長度的平行走線，需整齊排列以避開內側接點。" },
                    { t: "電源環繞線處理", d: "最外圈電源粗黑線需與內部走線至少保持 <span class='font-bold text-slate-700'>2格</span> 以上距離，防焊接排針時誤觸短路。" }
                ],
                qcTitle: "佈線與裝配控管點",
                qc: [
                    "極性確認：核對 3x4 Keypad 與七段顯示器 (CA共陽極) 腳位方向無誤。",
                    "反面佈線空間：實作時務必嚴守 9格/11格/12格 走線跨度限制，確保信號線不重疊交錯。"
                ],
                hasTable: true,
                tableData: [
                    { region: "R8-R10 電阻", grid: "<span class='text-orange-600 font-bold'>上下 3 格</span>", desc: "確保電阻上下焊接點跨距正確" },
                    { region: "Keypad 與 CPLD 間", grid: "<span class='text-orange-600 font-bold'>9格</span>", desc: "提供足夠空間處理 8 條掃描線的轉折" },
                    { region: "CPLD 與電阻間", grid: "<span class='text-orange-600 font-bold'>3格</span>", desc: "確保限流電阻 R1~R7 排列整齊且不與 IC 座重疊" },
                    { region: "底端垂直跨度", grid: "<span class='text-orange-600 font-bold'>11格 / 12格</span>", desc: "這是長距離信號跳線的參考長度，剪線時可依此計量" }
                ]
            }
        };

        let currentQuestion = 'q1';
        let currentSide = 'front';

        function updateUI() {
            const img = document.getElementById('main-pcb-image');
            const displayTitle = document.getElementById('display-title');
            const resContainer = document.getElementById('resistor-container');
            const stepsContainer = document.getElementById('steps-container');
            const qcContainer = document.getElementById('qc-container');
            const descPos = document.getElementById('desc-pos');
            const stepTitle = document.getElementById('step-title');
            const qcTitle = document.getElementById('qc-title');
            
            const tableSection = document.getElementById('table-section');
            const summaryTbody = document.getElementById('summary-tbody');
            
            const qData = config[currentQuestion];
            const fileId = qData[currentSide];
            const sideName = currentSide === 'front' ? '正面佈局' : '背面佈局';

            // 觸發整體動畫重置
            const infoPanel = document.getElementById('info-panel');
            infoPanel.classList.remove('fade-in');
            void infoPanel.offsetWidth; // trigger reflow
            infoPanel.classList.add('fade-in');

            // 1. 圖片切換
            img.style.opacity = '0';
            setTimeout(() => {
                if (fileId.includes("請在此填入")) {
                    handleImageError(img, "尚未設定圖片 ID");
                } else {
                    img.src = `https://lh3.googleusercontent.com/d/${fileId}`;
                    img.style.opacity = '1';
                }
                displayTitle.innerText = `${qData.title}：${sideName}`;
            }, 200);

            // 2. 定位說明與口訣更新
            descPos.innerHTML = qData.posDesc;
            resContainer.innerHTML = '';
            qData.mnemonic.forEach(num => {
                const node = document.createElement('div');
                node.className = 'resistor-node';
                node.innerText = num;
                resContainer.appendChild(node);
            });

            // 3. 作業程序更新
            stepTitle.innerHTML = `<i class="fas fa-route text-slate-500 mr-3"></i> 三、 ${qData.stepTitle}`;
            stepsContainer.innerHTML = '<div class="absolute left-[19px] top-2 bottom-2 w-0.5 bg-slate-100 -z-10"></div>';
            qData.steps.forEach((s, idx) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = 'flex gap-5 items-start';
                stepDiv.innerHTML = `
                    <div class="step-number shadow-lg shadow-blue-100">${idx + 1}</div>
                    <div>
                        <h3 class="text-base font-bold text-slate-900">${s.t}</h3>
                        <p class="text-base text-slate-500 mt-1 leading-relaxed">${s.d}</p>
                    </div>`;
                stepsContainer.appendChild(stepDiv);
            });

            // 4. 動態表格渲染
            if (qData.hasTable) {
                summaryTbody.innerHTML = '';
                qData.tableData.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors";
                    tr.innerHTML = `
                        <td class="px-4 py-3 font-medium text-slate-700">${row.region}</td>
                        <td class="px-4 py-3">${row.grid}</td>
                        <td class="px-4 py-3 text-slate-500">${row.desc}</td>
                    `;
                    summaryTbody.appendChild(tr);
                });
                tableSection.classList.remove('hidden');
            } else {
                tableSection.classList.add('hidden');
            }

            // 5. QC 控管點更新
            qcTitle.innerText = qData.qcTitle;
            qcContainer.innerHTML = '';
            qData.qc.forEach(q => {
                const li = document.createElement('li');
                li.className = 'flex items-start text-sm text-amber-800 font-medium';
                li.innerHTML = `<i class="fas fa-chevron-right mr-3 text-xs mt-1"></i> ${q}`;
                qcContainer.appendChild(li);
            });

            // 6. 按鈕樣式更新
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-slate-900', 'text-white');
                btn.classList.add('bg-white', 'text-slate-500');
            });
            const activeQTab = document.getElementById(`${currentQuestion}-tab`);
            activeQTab.classList.add('active', 'bg-slate-900', 'text-white');
            activeQTab.classList.remove('bg-white', 'text-slate-500');

            document.querySelectorAll('.sub-tab-btn').forEach(btn => {
                btn.classList.remove('active', 'text-white');
                btn.classList.add('text-slate-500');
            });
            document.getElementById(`${currentSide}-tab`).classList.add('active', 'text-white');
        }

        function switchQuestion(q) {
            currentQuestion = q;
            // 每次切換題目前，預設回到「正面」
            currentSide = 'front';
            updateUI();
        }

        function switchSide(side) {
            currentSide = side;
            updateUI();
        }

        function handleImageError(img, msg = "雲端連線失敗") {
            const container = document.getElementById('img-box');
            container.innerHTML = `
                <div class="text-center p-12 bg-white w-full rounded-2xl border-2 border-dashed border-slate-200">
                    <i class="fas fa-cloud-bolt text-6xl mb-4 text-amber-500"></i>
                    <p class="text-lg font-bold text-slate-700">${msg}</p>
                    <p class="text-sm text-slate-500 mt-3 px-8 leading-relaxed">
                        請確認在程式碼的 <strong>config</strong> 物件中已填入正確的圖片 ID。
                    </p>
                    <button onclick="location.reload()" class="inline-block mt-8 text-sm bg-slate-800 px-6 py-2 rounded-xl text-white font-medium hover:bg-slate-700 transition">
                       重新整理
                    </button>
                </div>`;
        }

        window.onload = updateUI;
    </script>
</body>
</html>
