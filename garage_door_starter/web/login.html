<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · 地下室鐵捲門</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b1020; color: #f1f5f9;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  form { width: min(360px, 88vw); }
  h1 { font-size: 20px; margin: 0 0 18px; }
  input {
    width: 100%; padding: 16px; font-size: 18px; border-radius: 12px;
    border: 1px solid #24304f; background: #141c33; color: inherit;
  }
  button {
    width: 100%; margin-top: 12px; padding: 16px; font-size: 18px; font-weight: 700;
    border: 0; border-radius: 12px; background: #2563eb; color: #fff; cursor: pointer;
  }
  #msg { margin-top: 12px; font-size: 14px; color: #f87171; min-height: 20px; }
</style>
</head>
<body>
<form id="f">
  <h1>地下室鐵捲門</h1>
  <input id="pw" type="password" placeholder="請輸入密碼" autofocus autocomplete="current-password">
  <button type="submit">進入</button>
  <div id="msg"></div>
</form>
<script>
const msg = document.getElementById('msg');

// 直接用檔案總管打開這個 .html 是沒用的：要連到電腦上跑的 door_web.py
if (location.protocol === 'file:') {
  msg.innerHTML = '這是直接開啟檔案，無法登入。<br>請改開 <b>http://localhost:8000</b>';
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  if (location.protocol === 'file:') return;
  msg.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value })
    });
    if (r.ok) location.href = '/';
    else msg.textContent = '密碼不對';
  } catch (err) {
    msg.textContent = '連不到 door_web.py，確認程式有在執行';
  }
});
</script>
</body>
</html>
