<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楊梅高中輪值表產生器</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Noto Sans TC (解決微軟正黑體垂直偏下問題) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (用於在瀏覽器編譯 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- html2canvas (用於下載圖片) -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- jsPDF (用於下載 PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- 載入本地行事曆數據 (繞過 file:/// 協議 CORS 限制) -->
    <script src="ymhs_calendar.js"></script>

    <style>
        body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 內建圖示組件 (取代 lucide-react 避免引入問題) ---
        const IconChevronLeft = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"></polyline></svg>;
        const IconChevronRight = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const IconEdit3 = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
        const IconCheckCircle = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconTrash2 = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const IconDownload = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconAlertCircle = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconCalculator = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line></svg>;
        const IconFolder = ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>;
        const IconFileText = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;

        // --- 配置與資料庫 ---
        // 吳鼎然已替換為廖恒慶
        const StaffList = ['卓淑美', '廖恒慶', '簡樹桐', '林君憲', '蔡宏昌', '余家賢'];

        const DefaultRules = {
          1: '簡樹桐', // 週一：預排簡樹桐
          2: '廖恒慶', // 週二：預設廖恒慶
          3: 'float',  // 週三：浮動（卓淑美、余家賢）
          4: '林君憲', // 週四：預設林君憲
          5: '蔡宏昌', // 週五：預設蔡宏昌
          0: null, 
          6: null 
        };

        const TaiwanHolidays = {
          '2025-01-01': '元旦',
          '2025-01-25': '春節連假', '2025-01-26': '春節連假', '2025-01-27': '春節連假', '2025-01-28': '除夕', '2025-01-29': '春節(初一)', '2025-01-30': '春節(初二)', '2025-01-31': '春節(初三)', '2025-02-01': '春節連假', '2025-02-02': '春節連假',
          '2025-02-28': '和平紀念日',
          '2025-04-03': '兒童節', '2025-04-04': '清明節',
          '2025-05-01': '勞動節',
          '2025-05-30': '端午節連假',
          '2025-09-29': '教師節補假',
          '2025-10-06': '中秋節',
          '2025-10-10': '國慶日',
          '2025-10-24': '光復節',
          '2025-12-25': '行憲紀念日',
          '2026-01-01': '元旦',
          '2026-02-14': '春節連假', '2026-02-15': '春節連假', '2026-02-16': '除夕', '2026-02-17': '春節(初一)', '2026-02-18': '春節(初二)', '2026-02-19': '春節(初三)', '2026-02-20': '春節連假', '2026-02-21': '春節連假', '2026-02-22': '春節連假',
          '2026-02-27': '和平紀念日(補假)', '2026-02-28': '和平紀念日',
          '2026-04-03': '兒童節(補假)', '2026-04-04': '兒童節', '2026-04-05': '清明節', '2026-04-06': '清明節(補假)',
          '2026-05-01': '勞動節',
          '2026-06-19': '端午節',
          '2026-09-25': '中秋節',
          '2026-09-28': '教師節',
          '2026-10-09': '國慶日(補假)', '2026-10-10': '國慶日',
          '2026-10-24': '光復節', '2026-10-25': '光復節(日)', '2026-10-26': '光復節(補假)',
          '2026-12-25': '行憲紀念日',
        };

        function App() {
          const [year, setYear] = useState(() => {
            const d = new Date();
            return d.getMonth() + 1 > 11 ? d.getFullYear() + 1 : d.getFullYear();
          });
          
          const [month, setMonth] = useState(() => {
            const d = new Date();
            const m = d.getMonth() + 2;
            return m > 12 ? m - 12 : m;
          });

          const [rosterData, setRosterData] = useState({});
          const [prevStats, setPrevStats] = useState({
            '卓淑美': 0, '廖恒慶': 0, '簡樹桐': 0, '林君憲': 0, '蔡宏昌': 0, '余家賢': 0
          });
          const [targetStats, setTargetStats] = useState({
            '卓淑美': 0, '廖恒慶': 0, '簡樹桐': 0, '林君憲': 0, '蔡宏昌': 0, '余家賢': 0
          });
          
          const [modalConfig, setModalConfig] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null });
          const [savedList, setSavedList] = useState([]); // 留存系統中的輪值表列表
          const [schoolEvents, setSchoolEvents] = useState([]); // 學校行事曆事件
          const [isCalendarModalOpen, setIsCalendarModalOpen] = useState(false); // 行事曆對話框開關
          const rosterRef = useRef(null);

          // Helpers
          const getDaysInMonth = (y, m) => new Date(y, m, 0).getDate();
          const getDayOfWeek = (y, m, d) => new Date(y, m - 1, d).getDay();
          const formatDate = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const getWeekDayName = (dayIndex) => ['日', '一', '二', '三', '四', '五', '六'][dayIndex];

          const daysInMonth = getDaysInMonth(year, month);
          const rowHeight = Math.floor(1410 / (daysInMonth + 1));
          const totalTableHeight = rowHeight * (daysInMonth + 1);

          const showMessage = (msg) => {
            setModalConfig({ isOpen: true, type: 'alert', message: msg, onConfirm: () => setModalConfig(prev => ({...prev, isOpen: false})) });
          };

          const showConfirm = (msg, onYes) => {
            setModalConfig({ 
              isOpen: true, 
              type: 'confirm', 
              message: msg, 
              onConfirm: () => {
                onYes();
                setModalConfig(prev => ({...prev, isOpen: false}));
              }
            });
          };

          // 從 LocalStorage 載入已存檔清單
          const loadSavedList = () => {
            const saved = localStorage.getItem('ym_rosters');
            if (saved) {
              try {
                setSavedList(Object.keys(JSON.parse(saved)).sort());
              } catch(e) {
                setSavedList([]);
              }
            } else {
              setSavedList([]);
            }
          };

          // 頁面初次載入時，直接從 window.YMHS_CALENDAR_DATA 載入本地行事曆數據 (解決 file:/// 協議 CORS 限制)
          useEffect(() => {
            if (window.YMHS_CALENDAR_DATA && Array.isArray(window.YMHS_CALENDAR_DATA)) {
              setSchoolEvents(window.YMHS_CALENDAR_DATA);
              console.log(`成功從本地 JS 腳本載入學校行事曆共 ${window.YMHS_CALENDAR_DATA.length} 筆活動。`);
            } else {
              // 備用：若無法載入，嘗試去 fetch 舊的 JSON
              fetch('ymhs_calendar.json')
                .then(res => {
                  if (!res.ok) throw new Error("File not found");
                  return res.json();
                })
                .then(data => {
                  setSchoolEvents(data);
                  console.log(`備用方案成功：從 JSON 載入 ${data.length} 筆活動。`);
                })
                .catch(err => {
                  console.warn("未能載入本地行事曆數據，請確保您已雙擊執行過 update_calendar.py 腳本：", err);
                });
            }
          }, []);

          // 初始化與年份/月份更動監聽
          useEffect(() => {
            loadSavedList();
            
            // 當切换年份/月份時，自動確認是否有存檔
            const saved = localStorage.getItem('ym_rosters');
            if (saved) {
              try {
                const allRosters = JSON.parse(saved);
                const key = `${year}-${String(month).padStart(2, '0')}`;
                if (allRosters[key]) {
                  setRosterData(allRosters[key].rosterData || {});
                  setTargetStats(allRosters[key].targetStats || {
                    '卓淑美': 0, '廖恒慶': 0, '簡樹桐': 0, '林君憲': 0, '蔡宏昌': 0, '余家賢': 0
                  });
                  return;
                }
              } catch(e) {}
            }
            // 若無存檔，則初始化假日與國定放假日備註
            const initialRoster = {};
            const daysCount = getDaysInMonth(year, month);
            for (let d = 1; d <= daysCount; d++) {
              const dateKey = formatDate(year, month, d);
              if (TaiwanHolidays[dateKey]) {
                initialRoster[dateKey] = { name: '', note: TaiwanHolidays[dateKey], note2: '' };
              }
            }
            setRosterData(initialRoster);
            setTargetStats({
              '卓淑美': 0, '廖恒慶': 0, '簡樹桐': 0, '林君憲': 0, '蔡宏昌': 0, '余家賢': 0
            });
          }, [year, month]);

          const hasConsecutiveConflict = (name, dateKey, currentRoster) => {
            if (!name) return false;
            const [y, m, d] = dateKey.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            const prev = new Date(date); prev.setDate(date.getDate() - 1);
            const prevKey = formatDate(prev.getFullYear(), prev.getMonth() + 1, prev.getDate());
            if (currentRoster[prevKey]?.name === name) return true;
            const next = new Date(date); next.setDate(date.getDate() + 1);
            const nextKey = formatDate(next.getFullYear(), next.getMonth() + 1, next.getDate());
            if (currentRoster[nextKey]?.name === name) return true;
            return false;
          };

          const hasWeeklyConflict = (name, dateKey, currentRoster) => {
            if (!name) return false;
            const [y, m, d] = dateKey.split('-').map(Number);
            const currentDate = new Date(y, m - 1, d);
            const day = currentDate.getDay(); 
            const diff = currentDate.getDate() - day; 
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(diff);

            for (let i = 0; i < 7; i++) {
              const checkDate = new Date(startOfWeek);
              checkDate.setDate(startOfWeek.getDate() + i);
              const checkKey = formatDate(checkDate.getFullYear(), checkDate.getMonth() + 1, checkDate.getDate());
              if (checkKey === dateKey) continue;
              if (currentRoster[checkKey]?.name === name) return true;
            }
            return false;
          };

          const handlePrevMonth = () => setMonth(m => m === 1 ? (setYear(y => y - 1), 12) : m - 1);
          const handleNextMonth = () => setMonth(m => m === 12 ? (setYear(y => y + 1), 1) : m + 1);

          const calculateTotalWorkingDays = () => {
            const days = getDaysInMonth(year, month);
            let count = 0;
            for (let d = 1; d <= days; d++) {
              const dateKey = formatDate(year, month, d);
              const dayIdx = getDayOfWeek(year, month, d);
              if (!TaiwanHolidays[dateKey] && dayIdx !== 0 && dayIdx !== 6) count++;
            }
            return count;
          };
          const totalWorkingDays = calculateTotalWorkingDays();

          const handleCalculateTargets = () => {
            const daysCount = getDaysInMonth(year, month);
            const totalSlots = calculateTotalWorkingDays();
            const staffCount = StaffList.length;
            
            const baseCount = Math.floor(totalSlots / staffCount);
            const remainder = totalSlots % staffCount;
            
            const newTargets = {};
            StaffList.forEach((name, index) => {
              newTargets[name] = baseCount + (index < remainder ? 1 : 0);
            });
            setTargetStats(newTargets);

            const newRoster = {};
            for (let d = 1; d <= daysCount; d++) {
              const dateKey = formatDate(year, month, d);
              if (TaiwanHolidays[dateKey]) {
                newRoster[dateKey] = { name: '', note: TaiwanHolidays[dateKey] };
              }
            }
            setRosterData(newRoster);
            showMessage(`系統已計算本月工作日共 ${totalSlots} 天。\n已將「目標次數」平均分配。\n\n請在右側檢查並手動調整每人的「目標次數」，\n確定後請按 Step 2 進行排班。`);
          };

          const handleGenerateFromTargets = () => {
            const targetSum = Object.values(targetStats).reduce((a, b) => a + parseInt(b||0), 0);
            
            const runGeneration = () => {
                const daysCount = getDaysInMonth(year, month);
                const newRoster = { ...rosterData };
                let workDays = [];
                let currentCounts = {};
                StaffList.forEach(p => currentCounts[p] = 0);
                
                const floatStaff = ['卓淑美', '余家賢'];
                let floatIdx = 0;

                for (let d = 1; d <= daysCount; d++) {
                  const dateKey = formatDate(year, month, d);
                  const dayIdx = getDayOfWeek(year, month, d);

                  if (TaiwanHolidays[dateKey]) {
                    newRoster[dateKey] = { name: '', note: TaiwanHolidays[dateKey] };
                    continue;
                  }
                  if (dayIdx === 0 || dayIdx === 6) {
                    newRoster[dateKey] = { name: '', note: newRoster[dateKey]?.note || '' };
                    continue;
                  }

                  workDays.push({ d, dateKey, dayIdx });
                  let assignedName = '';
                  if (DefaultRules[dayIdx] === 'float') {
                    assignedName = floatStaff[floatIdx % 2];
                    floatIdx++;
                  } else if (DefaultRules[dayIdx]) {
                    assignedName = DefaultRules[dayIdx];
                  }
                  
                  newRoster[dateKey] = { ...newRoster[dateKey], name: assignedName };
                  if (assignedName) currentCounts[assignedName]++;
                }

                for(let iter=0; iter<3; iter++) {
                    [...workDays].reverse().forEach(({ dateKey, dayIdx }) => {
                      const currentName = newRoster[dateKey]?.name;
                      if (!currentName) return;

                      const target = parseInt(targetStats[currentName]) || 0;
                      
                      if (currentCounts[currentName] > target) {
                        const candidates = StaffList
                          .filter(n => currentCounts[n] < (parseInt(targetStats[n]) || 0))
                          .sort((a, b) => {
                              const gapA = (parseInt(targetStats[a])||0) - currentCounts[a];
                              const gapB = (parseInt(targetStats[b])||0) - currentCounts[b];
                              return gapB - gapA;
                          });

                        let swapTarget = null;
                        for (const cand of candidates) {
                          if (!hasConsecutiveConflict(cand, dateKey, newRoster) && !hasWeeklyConflict(cand, dateKey, newRoster)) {
                            swapTarget = cand;
                            break;
                          }
                        }

                        if (swapTarget) {
                          newRoster[dateKey].name = swapTarget;
                          currentCounts[currentName]--;
                          currentCounts[swapTarget]++;
                        }
                      }
                    });
                }
                setRosterData(newRoster);
            };

            if (targetSum !== totalWorkingDays) {
              showConfirm(`注意：目前設定的目標總數 (${targetSum}) 與本月工作日 (${totalWorkingDays}) 不符。\n系統將盡力排班，但可能會有空缺或超額。\n是否繼續？`, runGeneration);
            } else {
              runGeneration();
            }
          };

          // 儲存目前的輪值表在系統中
          const handleSaveRoster = () => {
            const saved = localStorage.getItem('ym_rosters') || '{}';
            let allRosters = {};
            try {
              allRosters = JSON.parse(saved);
            } catch(e) {
              allRosters = {};
            }
            const key = `${year}-${String(month).padStart(2, '0')}`;
            allRosters[key] = {
              rosterData,
              targetStats
            };
            localStorage.setItem('ym_rosters', JSON.stringify(allRosters));
            loadSavedList();
            showMessage(`已成功在系統存檔：${year} 年 ${month} 月的輪值表！`);
          };

          // 載入指定的存檔紀錄
          const handleLoadRoster = (key) => {
            const [y, m] = key.split('-').map(Number);
            setYear(y);
            setMonth(m);
            const saved = localStorage.getItem('ym_rosters');
            if (saved) {
              try {
                const allRosters = JSON.parse(saved);
                if (allRosters[key]) {
                  setRosterData(allRosters[key].rosterData || {});
                  setTargetStats(allRosters[key].targetStats || {});
                }
              } catch(e) {}
            }
          };

          // 解析 ICS 格式文本
          const parseICS = (icsText) => {
            const events = [];
            const vevents = icsText.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/g);
            if (!vevents) return [];
            
            vevents.forEach(vevent => {
              const summaryMatch = vevent.match(/SUMMARY:(.*?)\r?\n/);
              const dtstartMatch = vevent.match(/DTSTART(?:;VALUE=DATE)?:([0-9T]+)\r?\n/);
              const dtendMatch = vevent.match(/DTEND(?:;VALUE=DATE)?:([0-9T]+)\r?\n/);
              const descMatch = vevent.match(/DESCRIPTION:(.*?)\r?\n/);
              
              if (!summaryMatch || !dtstartMatch) return;
              
              const summary = summaryMatch[1].trim ? summaryMatch[1].trim() : summaryMatch[1];
              const cleanedSummary = summary
                .replace(/\\,/g, ',')
                .replace(/\\;/g, ';')
                .replace(/\\n/g, '\n');
                
              const startStr = dtstartMatch[1].trim ? dtstartMatch[1].trim() : dtstartMatch[1];
              const endStr = dtendMatch ? (dtendMatch[1].trim ? dtendMatch[1].trim() : dtendMatch[1]) : startStr;
              
              const startDateStr = startStr.substring(0, 8);
              const endDateStr = endStr.substring(0, 8);
              
              const startYear = parseInt(startDateStr.substring(0, 4));
              const startMonth = parseInt(startDateStr.substring(4, 6)) - 1;
              const startDay = parseInt(startDateStr.substring(6, 8));
              
              const endYear = parseInt(endDateStr.substring(0, 4));
              const endMonth = parseInt(endDateStr.substring(4, 6)) - 1;
              const endDay = parseInt(endDateStr.substring(6, 8));
              
              let startDate = new Date(startYear, startMonth, startDay);
              let endDate = new Date(endYear, endMonth, endDay);
              
              if (endStr.length === 8 || !endStr.includes('T')) {
                if (endDate > startDate) {
                  endDate.setDate(endDate.getDate() - 1);
                }
              }
              
              let curr = new Date(startDate);
              while (curr <= endDate) {
                const yyyy = curr.getFullYear();
                const mm = String(curr.getMonth() + 1).padStart(2, '0');

          const handleExportHTML = () => {

            setTimeout(() => {
              const htmlContent = buildStandaloneHTML();
              const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = `楊梅高中輪值表_${year}_${month}_列印版.html`;
              link.click();
            }, 100);
          };

          // 透過隱藏的 iframe 直接呼叫瀏覽器原生列印引擎
          const handleIframePrint = () => {
            const htmlContent = buildStandaloneHTML();
            const iframe = document.createElement('iframe');
            iframe.style.position = 'fixed';
            iframe.style.right = '0';
            iframe.style.bottom = '0';
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = '0';
            document.body.appendChild(iframe);
            
            iframe.contentDocument.write(htmlContent);
            iframe.contentDocument.close();
            
            iframe.contentWindow.focus();
            setTimeout(() => {
              iframe.contentWindow.print();
              setTimeout(() => {
                document.body.removeChild(iframe);
              }, 1000);
            }, 500);
          };

          return (
            <div className="min-h-screen p-4 md:p-6 flex flex-col items-center">

              </div>

                    {/* Modal Header */}

                        </h3>

                      <button 
                        onClick={() => setIsCalendarModalOpen(false)}

                      </button>

                    {/* Modal Actions Toolbar */}

                                  </div>
                                  <div className="flex gap-2 w-full md:w-auto justify-end">
                                    <button 
                                      onClick={() => importEventToNote(ev.date, ev.summary, 'note')}
